<body>
<div id="top"><a href="../?start=1" aria-label="Späť na výber ihriska" style="font-size:1.4rem">‹</a><div style="flex:1"><b id="h-t">Akadémia</b><small id="h-s"></small></div><div id="holes"><a data-h="1" href="?h=1">1</a><a data-h="2" href="?h=2">2</a><a data-h="3" href="?h=3">3</a></div></div>

<script type="module">
import * as THREE from "three";
import {OrbitControls} from "./lib/OrbitControls.js";

// Akadémia Apex Golf, Báč. Terén z DMR 5.0 (ÚGKK SR, CC BY 4.0), greeny/bunkre/stromy obkreslené zo satelitu
// a zarovnané na terén. Dáta: akademia.json (ENU metre od greenu 1, x = východ, y = sever).
const Q=new URLSearchParams(location.search);
// ihrisko: ?c=apex = 18-jamkové Apex Báč (apex.json), inak akadémia
const CRS=Q.get("c")==="apex"?"apex":"akademia",CQ=CRS==="apex"?"c=apex&":"";
const DATA=await (await fetch(CRS+".json")).json();
const READY=DATA.ready||DATA.gc.map((_,i)=>i+1),LASTH=READY[READY.length-1];
const PARS=DATA.par||READY.map(()=>3);
const hNum=READY.includes(parseInt(Q.get("h")))?parseInt(Q.get("h")):READY[0];
const TEE_N=DATA.teeNames||["biele","žlté","červené"],TEE_C=DATA.teeColors||["#fff","#ffd400","#e0312b"];
const tIdx=Math.min(TEE_N.length-1,Math.max(0,parseInt(Q.get("t"))||0));
const PAR=PARS[hNum-1]||3;
const STYLE=(CRS==="apex"?{}:{1:{},2:{},3:{sunWest:true}}[hNum])||{};
// navigácia jamiek a odpalísk podľa dát ihriska
if(CRS==="apex"){document.getElementById("holes").innerHTML=READY.map(h=>`<a data-h="${h}">${h}</a>`).join("");
  document.getElementById("tees").innerHTML="<span>Odpalisko:</span>"+TEE_N.map((nm,j)=>`<a data-t="${j}" title="${nm}"><i style="background:${TEE_C[j]}"></i><b>${nm}</b></a>`).join("");
  document.getElementById("tees").classList.add("many")}

// --- terén
const TR=DATA.terrain,Hcm=new Int16Array(Uint8Array.from(atob(TR.cm),c=>c.charCodeAt(0)).buffer);
function hENU(e,n){let c=(e-TR.e0)/TR.step,r=(n-TR.n0)/TR.step;c=Math.min(TR.w-1.001,Math.max(0,c));r=Math.min(TR.h-1.001,Math.max(0,r));
  const c0=c|0,r0=r|0,fc=c-c0,fr=r-r0,i=r0*TR.w+c0;
  return TR.base+(Hcm[i]*(1-fc)*(1-fr)+Hcm[i+1]*fc*(1-fr)+Hcm[i+TR.w]*(1-fc)*fr+Hcm[i+TR.w+1]*fc*fr)/100}

// --- lokálny rámec jamky: odpalisko (0,0), y = smer na stred greenu, x = vpravo
const T=DATA.pads[hNum][tIdx],GC=DATA.gc[hNum-1];
const dx=GC[0]-T[0],dy=GC[1]-T[1],L=Math.hypot(dx,dy),u=[dx/L,dy/L],rt=[u[1],-u[0]];
const loc=([e,n])=>[(e-T[0])*rt[0]+(n-T[1])*rt[1],(e-T[0])*u[0]+(n-T[1])*u[1]];
const enu=(x,y)=>[T[0]+x*rt[0]+y*u[0],T[1]+x*rt[1]+y*u[1]];
const H0=hENU(T[0],T[1]);
let hBump=()=>0;
const hL=(x,y)=>hENU(...enu(x,y))-H0+hBump(x,y);
const c=Math.round(L);
// predok a zadok greenu po línii hry
let green=DATA.greens[hNum-1].map(loc);
// hrubé obrysy (málo bodov) vyhladíme, aby green nemal rohy
for(let k=0;k<3&&green.length<40;k++)green=green.flatMap((p,i)=>{const q=green[(i+1)%green.length];return[[.75*p[0]+.25*q[0],.75*p[1]+.25*q[1]],[.25*p[0]+.75*q[0],.25*p[1]+.75*q[1]]]});
let ys=[];for(let i=0;i<green.length;i++){const[a,b]=green[i],[d,e]=green[(i+1)%green.length];if((a<=0)!==(d<=0)){ys.push(b+(e-b)*(0-a)/(d-a))}}
const f=Math.round(Math.min(...ys)),b=Math.round(Math.max(...ys));
// vzdialenosť bodu od obrysu (záporná vnútri)
const inPoly=(pt,poly)=>{let s=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const[a,b]=poly[i],[d,e]=poly[j];if(((b>pt[1])!==(e>pt[1]))&&(pt[0]<(d-a)*(pt[1]-b)/(e-b)+a))s=!s}return s};
function sdist(x,y,P){let m=1e9;for(let i=0,j=P.length-1;i<P.length;j=i++){const[a,b]=P[j],[d,e]=P[i],vx=d-a,vy=e-b,l=vx*vx+vy*vy;
  let t=l?((x-a)*vx+(y-b)*vy)/l:0;t=t<0?0:t>1?1:t;const qx=a+t*vx-x,qy=b+t*vy-y;m=Math.min(m,qx*qx+qy*qy)}m=Math.sqrt(m);return inPoly([x,y],P)?-m:m}
const sstep=t=>t<=0?0:t>=1?1:t*t*(3-2*t);
// --- modelácia greenu na skutočnom teréne: mierny sklon odzadu dopredu, jemné vlnky (do ~30 cm),
//     zvýšené okraje pri bunkroch a mäkké hrany bunkrov
const GB=(()=>{let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(const[x,y]of green){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}return{x0,x1,y0,y1}})();
const gcx=(GB.x0+GB.x1)/2,gcy=(GB.y0+GB.y1)/2;
const myBunkers=[];
const BUMPS=[[3.5,4,4.2,.13],[-4,-3,3.6,-.09],[-3,4.5,3.2,.08],[4,-5,3,-.06]];
// green: terén pod ním vyrovnáme do mierne sklonenej roviny (max ~2 %), pri jamke ešte rovnejšie – ako na skutočnom greene
const raw=(x,y)=>hENU(...enu(x,y))-H0;
const GP=(()=>{const e=5,h0=raw(gcx,gcy);let sx=(raw(gcx+e,gcy)-raw(gcx-e,gcy))/(2*e),sy=(raw(gcx,gcy+e)-raw(gcx,gcy-e))/(2*e)+.011;const m=Math.hypot(sx,sy),mx=.015;if(m>mx){sx*=mx/m;sy*=mx/m}return{h0,sx,sy}})();
hBump=(x,y)=>{const M=9;let h=0;
  for(const B of myBunkers){const bb=B.bb;if(x<bb[0]||x>bb[1]||y<bb[2]||y>bb[3])continue;const d=sdist(x,y,B);if(d>4)continue;
    if(d>=0){h+=.2*Math.exp(-(((d-.9)/.8)**2))*(B.gd<6?1:.5)}else{h-=.14*sstep(-d/1.5)}}
  if(x<GB.x0-M||x>GB.x1+M||y<GB.y0-M||y>GB.y1+M)return h;
  const sd=sdist(x,y,green);const w=sd<=0?1:1-sstep(sd/4.5);
  if(w>0){const pl=GP.h0+GP.sx*(x-gcx)+GP.sy*(y-gcy);h+=w*(pl-raw(x,y));const dp=Math.hypot(x,y-c),fl=.2+.8*sstep(Math.min(1,dp/5));
    for(const[bx,by,sg,a]of BUMPS){const dx=x-gcx-bx,dy=y-gcy-by;h+=w*fl*a*Math.exp(-(dx*dx+dy*dy)/(2*sg*sg))}}
  return h};
const hG=hL(0,c);
const cen=P=>[P.reduce((a,p)=>a+p[0],0)/P.length,P.reduce((a,p)=>a+p[1],0)/P.length];
const nearestGreen=B=>{const q=cen(B);let bi=0,bd=1e9;DATA.gc.forEach((g,i)=>{if(!g)return;const d=(g[0]-q[0])**2+(g[1]-q[1])**2;if(d<bd){bd=d;bi=i}});return bi};
for(const B of DATA.bunkers)if(nearestGreen(B)===hNum-1)myBunkers.push(B.map(loc));
for(const B of myBunkers){let a=1e9,b=-1e9,c2=1e9,d=-1e9;for(const[x,y]of B){a=Math.min(a,x);b=Math.max(b,x);c2=Math.min(c2,y);d=Math.max(d,y)}B.bb=[a-4,b+4,c2-4,d+4];B.gd=Math.min(...B.map(([x,y])=>sdist(x,y,green)))}
document.getElementById("h-t").textContent="Jamka "+hNum+" · Par "+PAR;
const BD=DATA.bend&&DATA.bend[hNum]?loc(DATA.bend[hNum]):null,cP=BD?Math.round(Math.hypot(...BD)+Math.hypot(BD[0],c-BD[1])):c;
document.getElementById("h-s").textContent=TEE_N[tIdx]+" · "+(f+cP-c)+" / "+cP+" / "+(b+cP-c)+" m";
document.querySelectorAll("#holes a").forEach(a=>{a.href="?"+CQ+"h="+a.dataset.h+"&t="+tIdx;a.classList.toggle("on",+a.dataset.h===hNum)});
document.querySelectorAll("#tees a").forEach(a=>{a.href="?"+CQ+"h="+hNum+"&t="+a.dataset.t;a.classList.toggle("on",+a.dataset.t===tIdx)});
document.getElementById("note").textContent="Terén © ÚGKK SR, DMR 5.0 (CC BY 4.0)";

// --- scéna
const scene=new THREE.Scene();
const sky=STYLE.sunWest?0xd9e3ea:0xc4dbee,skyTop=STYLE.sunWest?0x6f9bd0:0x4f8fd8;
scene.background=new THREE.Color(sky);scene.fog=new THREE.Fog(sky,Math.max(350,c+120),Math.max(900,c+550));
// obloha: jemný prechod od obzoru do modra (jedna guľa, lacné aj na telefóne)
{const sg=new THREE.SphereGeometry(1300,24,12),cA=new THREE.Color(sky),cB=new THREE.Color(skyTop),col=[];const pp=sg.attributes.position;
 for(let i=0;i<pp.count;i++){const t=Math.pow(Math.max(0,pp.getY(i)/1300),.55),cc=cA.clone().lerp(cB,t);col.push(cc.r,cc.g,cc.b)}
 sg.setAttribute("color",new THREE.Float32BufferAttribute(col,3));
 const dome=new THREE.Mesh(sg,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide,fog:false,depthWrite:false}));dome.renderOrder=-1;dome.frustumCulled=false;
 dome.onBeforeRender=(r,sc,cam)=>dome.position.copy(cam.position);scene.add(dome)}
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,1,1500);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
const W=(x,y,h)=>new THREE.Vector3(x,h,-y);
// jemná textúra trávy zblízka: malá opakovaná šumová textúra (R = steblá, G = väčšie fľaky), vmiešaná do farby v shaderi
const DN=(()=>{const n=128,cv=document.createElement("canvas");cv.width=cv.height=n;const x=cv.getContext("2d"),im=x.createImageData(n,n);let sd=12345;const r=()=>(sd=(sd*16807)%2147483647)/2147483647;
  const L=8,lat=[];for(let i=0;i<L*L;i++)lat.push(r());const sm=t=>t*t*(3-2*t);
  const vn=(u,v)=>{const i=Math.floor(u),j=Math.floor(v),fu=sm(u-i),fv=sm(v-j),g=(a,b)=>lat[((b%L+L)%L)*L+((a%L+L)%L)];return (g(i,j)*(1-fu)+g(i+1,j)*fu)*(1-fv)+(g(i,j+1)*(1-fu)+g(i+1,j+1)*fu)*fv};
  const row=new Float32Array(n);for(let j=0;j<n;j++){for(let i=0;i<n;i++){const k=(j*n+i)*4;
    // steblá: šum predĺžený v jednom smere (vyzerá ako tráva, nie ako bodky)
    const a=(r()+r()+r())/3,b=row[i]||a;row[i]=a*.55+b*.45;im.data[k]=Math.round(row[i]*255);
    im.data[k+1]=Math.round(vn(i/n*L,j/n*L)*255);im.data[k+2]=128;im.data[k+3]=255}}
  x.putImageData(im,0,0);const t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;return t})();
function grassDetail(mat,amt){mat.onBeforeCompile=sh=>{sh.uniforms.dTex={value:DN};sh.uniforms.dA={value:amt};
  sh.vertexShader=sh.vertexShader.replace("#include <common>","#include <common>\nvarying vec2 vWp;").replace("#include <begin_vertex>","#include <begin_vertex>\nvWp=(modelMatrix*vec4(transformed,1.)).xz;");
  sh.fragmentShader=sh.fragmentShader.replace("#include <common>","#include <common>\nuniform sampler2D dTex;uniform float dA;varying vec2 vWp;")
   .replace("#include <map_fragment>","#include <map_fragment>\n{float f=texture2D(dTex,vWp*vec2(1.9,1.3)).r,g=texture2D(dTex,vWp*.045).g,h=texture2D(dTex,vWp*.31).g;diffuseColor.rgb*=1.+((f-.5)*.8+(g-.5)*.9+(h-.5)*.5)*dA;}")};
  return mat}          // svet: X vpravo, Y hore, -Z dopredu
const hemi=new THREE.HemisphereLight(0xdff1ff,0x3a5a2a,STYLE.sunWest?1.9:1.15);scene.add(hemi);
const sun=new THREE.DirectionalLight(STYLE.sunWest?0xfff1d6:0xffffff,STYLE.sunWest?1.25:1.6);
// slnko: z juhu (poobede), pri jamke 3 večer zo západu
const sunDir=STYLE.sunWest?[-1,0.15]:[0.3,-1];const sl=loc([T[0]+sunDir[0]*200,T[1]+sunDir[1]*200]);
sun.position.copy(W(sl[0],sl[1],170));sun.target.position.copy(W(0,c*.5,0));sun.castShadow=true;
Object.assign(sun.shadow.camera,{left:-220,right:220,top:220,bottom:-220,near:1,far:800});sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-0.0003;sun.shadow.normalBias=0.5;
scene.add(sun,sun.target);

// --- terén + "namaľovaný" povrch (rough, fairway, greeny, bunkre, odpaliská)
const X0=-170,X1=170,Y0=-70,Y1=c+150,SEG=2;
const geo=new THREE.PlaneGeometry(X1-X0,Y1-Y0,(X1-X0)/SEG,(Y1-Y0)/SEG);geo.rotateX(-Math.PI/2);
geo.translate((X0+X1)/2,0,-(Y0+Y1)/2);
{const p=geo.attributes.position,m=4.5;for(let i=0;i<p.count;i++){const x=p.getX(i),y=-p.getZ(i);let h=hL(x,y);
  // pod jemnou sieťou greenu hrubý terén mierne znížime, aby cez ňu nepresvital (inak ostrý „odrezaný“ okraj pri bunkri)
  if(x>GB.x0-7+m&&x<GB.x1+7-m&&y>GB.y0-7+m&&y<GB.y1+7-m&&!myBunkers.some(B=>inPoly([x,y],B)))h-=.35;p.setY(i,h)}geo.computeVertexNormals()}
const TEX=2048,cv=document.createElement("canvas");cv.width=cv.height=TEX;const g2=cv.getContext("2d");
const tx=x=>(x-X0)/(X1-X0)*TEX,ty=y=>(Y1-y)/(Y1-Y0)*TEX,ppm=TEX/(X1-X0);
function path(P){g2.beginPath();P.forEach(([x,y],i)=>i?g2.lineTo(tx(x),ty(y)):g2.moveTo(tx(x),ty(y)));g2.closePath()}
g2.fillStyle=STYLE.dry?"#b3ad66":"#86a352";g2.fillRect(0,0,TEX,TEX);
// textúra trávy: náhodné škvrny
let seed=7+hNum*13;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
for(let k=0;k<900;k++){g2.fillStyle=STYLE.dry?(rnd()<.5?"rgba(150,150,80,.10)":"rgba(210,200,140,.10)"):(rnd()<.5?"rgba(90,130,50,.10)":"rgba(150,180,90,.10)");
  const r=(4+rnd()*10)*ppm;g2.beginPath();g2.arc(rnd()*TEX,rnd()*TEX,r,0,7);g2.fill()}
// pokosené plochy: podľa leteckých záberov (jamky 1 a 2), inak odhad

    return[[S.x-dx*9,S.y-dy*9,S.z+3.2],[S.x+dx*40,S.y+dy*40,gS(S.x+dx*40,S.y+dy*40)+1]]}
  function camUpd(dt,snap){const[p,t]=camGoal();const P=W(p[0],p[1],Math.max(p[2],gS(p[0],p[1])+1.2)),T=W(...t);
    const k=snap?1:1-Math.exp(-dt*(S.mode==="fly"?2.2:4));camP.lerp(P,k);camT.lerp(T,k);camera.position.copy(camP);camera.lookAt(camT)}
  // ovládanie
  let hold=null,turn=0;
  const powOf=t=>{const ph=(t/2300)%2;return ph<1?ph:2-ph};
  $("p-hit").addEventListener("pointerdown",e=>{if(S.mode!=="aim")return;e.preventDefault();hold=performance.now();$("p-hit").setPointerCapture(e.pointerId)});
  const rel=e=>{if(hold==null)return;const p=Math.max(.04,powOf(performance.now()-hold));hold=null;$("p-pow").style.width="0";shoot(p)};
  $("p-hit").addEventListener("pointerup",rel);$("p-hit").addEventListener("pointercancel",()=>{hold=null;$("p-pow").style.width="0"});
  for(const[id,dv]of[["p-l",-1],["p-r",1]]){const b=$(id);b.addEventListener("pointerdown",e=>{e.preventDefault();turn=dv});for(const ev of["pointerup","pointerleave","pointercancel"])b.addEventListener(ev,()=>{turn=0})}
  $("p-cp").onclick=()=>{if(S.mode!=="aim")return;S.club=Math.min(CLUBS.length-1,S.club+1);info();drawAim()};
  $("p-cm").onclick=()=>{if(S.mode!=="aim")return;S.club=Math.max(0,S.club-1);info();drawAim()};
  $("p-v").onclick=()=>{S.view=1-S.view};
  // potiahnutie prstom po scéne = mierenie
  let drag=null;renderer.domElement.addEventListener("pointerdown",e=>{drag=e.clientX});
  addEventListener("pointermove",e=>{if(drag==null||S.mode!=="aim")return;S.aim+=(e.clientX-drag)*.0011;drag=e.clientX;drawAim()});
  addEventListener("pointerup",()=>{drag=null});
  game={update(dt){hudTick();
      if(turn&&S.mode==="aim"){S.aim+=turn*dt*.16;drawAim()}
      if(hold!=null){const p=powOf(performance.now()-hold);$("p-pow").style.width=(p*100)+"%";const cl=CLUBS[S.club];
        $("p-ht").textContent=cl.a?"Sila "+Math.round(p*100)+" % · ≈ "+Math.round(cl.c*S.lie.m*p)+" m":"Pat ≈ "+(cl.c*p).toFixed(1).replace(".",",")+" m"}
      else if(S.mode==="aim")$("p-ht").textContent=CLUBS[S.club].a?"Drž a pusti – úder":"Drž a pusti – pat";
      const n=4;for(let i=0;i<n;i++)step(dt/n);
      if(S.mode==="fly"||S.mode==="roll"||S.mode==="drop"){place();if(S.tr<600){trailP.set([S.x,S.z+.05,-S.y],S.tr*3);S.tr++;trailG.setDrawRange(0,S.tr);trailG.attributes.position.needsUpdate=true}
        if(S.mode==="roll"||S.mode==="wait")info()}
      if(S.mode!=="in")camUpd(dt,false);
      {const nearG=S.mode!=="fly"&&sdist(S.x,S.y,green)<6,dd=camera.position.distanceTo(ball.position);ball.scale.setScalar(Math.min(2.5,Math.max(nearG?.24:.35,dd/(nearG?40:14))))}
      if(S.mode!=="in")place();   // výška loptičky podľa aktuálnej veľkosti (leží na tráve)
      // pri patovaní je vlajka vytiahnutá, aby bolo vidno jamku
      {const pull=S.mode!=="fly"&&!CLUBS[S.club].a&&toPin()<25;pin.visible=flag.visible=!pull}}};
  document.getElementById("h-t").innerHTML=`<span class="hn">${hNum}</span><span class="hp">PAR ${PAR}${SC.length?" · zatiaľ "+SC.reduce((a,b)=>a+b,0):""}</span>`;
  prepare();{const[p,t]=camGoal();camP.copy(W(...p));camT.copy(W(...t))}camUpd(0,true);
  if(Q.has("dbg"))window.__g={S,prepare,shoot,PIN,camUpd,CLUBS,setAim,surf,grad,gS,R};
}

let lastT=0;
function loop(now){const dt=Math.min(.05,lastT?(now-lastT)/1000:0);lastT=now;
  if(fly){const k=Math.min(1,(now-fly.t0)/9000),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    camera.position.copy(curve.getPoint(e));controls.target.copy(W(0,c,hG));if(k>=1)fly=null}
  waveFlag(now/1000);if(game)game.update(dt);else{controls.update();
    // kamera nesmie ísť pod terén
    {const t=controls.target;t.x=Math.max(X0+5,Math.min(X1-5,t.x));t.z=Math.max(-(Y1-5),Math.min(-(Y0+5),t.z));t.y+=(hL(t.x,-t.z)-t.y)*.15;
     const cp=camera.position,gh=hL(cp.x,-cp.z)+.45;if(cp.y<gh){cp.y=gh;camera.lookAt(controls.target)}}}fadeTrees();renderer.render(scene,camera);placeLabels();repTick();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
// nová verzia appky: service worker sa hneď aktualizuje a stránka sa raz obnoví
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("../sw.js",{scope:"../"}).then(r=>r.update()).catch(()=>{});
  let rl=false;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(rl)return;rl=true;location.reload()})}
</script>
