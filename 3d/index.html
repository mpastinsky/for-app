<script>/* prechody bez preblikntia: nová obrazovka (jamka / prehľad) sa načíta v rámci nad tou súčasnou
   a ukáže sa až keď má vykreslený prvý záber; stará sa potom zahodí. Odkazy mimo 3D (späť do appky) idú normálne. */
(function(){const EMB=window.parent!==window;window.__EMB=EMB;let frames=[];
 const abs=u=>new URL(u,location.href).href,in3d=u=>false;   // 3D obrazovky sa otvárajú normálnym načítaním stránky (rámce s dvoma scénami naraz sekali – Martin, v140)
 const snap=u=>{try{if(window.__snap&&/\/3d\//.test(new URL(u,location.href).pathname)){const d=window.__snap();if(d)sessionStorage.setItem("for.snap",d)}}catch(e){}};
 window.forNav=function(url){if(!in3d(url)){snap(url);(EMB?top:window).location.href=abs(url);return}
   if(window.__playHere&&window.__playHere(abs(url)))return;   // tá istá jamka → hra sa spustí hneď, bez nového načítania scény
   if(window.__freeze)window.__freeze();if(EMB){parent.postMessage({forGo:abs(url)},"*");return}openFrame(abs(url))};
 function openFrame(u){const f=document.createElement("iframe");f.src=u;f.setAttribute("allow","geolocation; accelerometer; gyroscope");
   f.style.cssText="position:fixed;left:0;top:0;width:100%;height:100%;border:0;opacity:0;z-index:1000;transition:opacity .3s;background:#5e8443";f.__url=u;document.body.appendChild(f);frames.push(f);f.__to=setTimeout(()=>{if(f.style.opacity!=="1")location.href=u},40000)}
 addEventListener("message",e=>{const d=e.data||{};if(EMB)return;
   if(d.forGo)openFrame(d.forGo);
   if(d.forReady){const f=frames.find(x=>x.contentWindow===e.source);if(!f)return;f.style.opacity="1";try{history.replaceState(null,"",f.__url)}catch(_){}
     setTimeout(()=>{frames.filter(x=>x!==f).forEach(x=>x.remove());frames=[f];if(window.__hostStop)window.__hostStop()},350)}});
 document.addEventListener("click",e=>{const a=e.target.closest&&e.target.closest("a[href]");if(!a||e.defaultPrevented||a.target||e.metaKey||e.ctrlKey)return;
   const h=a.getAttribute("href");if(!h||h[0]==="#"||/^(javascript|mailto|tel|sms|whatsapp):/i.test(h))return;e.preventDefault();forNav(h)});
})();</script>
<script>/* plynulý prechod: posledný záber predchádzajúcej obrazovky ostane viditeľný, kým sa nová scéna nevykreslí */

<script type="module">
import * as THREE from "three";

// Akadémia Apex Golf, Báč. Terén z DMR 5.0 (ÚGKK SR, CC BY 4.0), greeny/bunkre/stromy obkreslené zo satelitu
// a zarovnané na terén. Dáta: akademia.json (ENU metre od greenu 1, x = východ, y = sever).
const Q=new URLSearchParams(location.search);
// ihrisko: ?c=apex = 18-jamkové Apex Báč (apex.json), inak akadémia
const CRS=Q.get("c")==="apex"?"apex":"akademia",CQ=CRS==="apex"?"c=apex&":"";
const HQ=CRS!=="apex",OTHL=[];   // vylepšená grafika (zatiaľ akadémia)
const DATA=await (await fetch(CRS+".json")).json();
// okolie areálu (Martin 24.11.): dáta druhého ihriska + nízky terén celého areálu; akadémii pridáme plochy 18-ky, ktoré zasahujú do jej okna
// 18-ka: stromy podľa druhov (apex.json trees[k][5]; borovica, tuja, agát, javor, dub, lipa, ker) – lib/species.js, akadémia ho nepoužíva
const SPC=!HQ&&DATA.trees.some(t=>t[5])?await import("./lib/species.js").catch(e=>{console.warn(e);return null}):null;
const AR=await import("./lib/areal.js").then(M=>M.loadAreal(CRS,DATA).then(A=>A&&{M,A})).catch(e=>{console.warn(e);return null});
if(AR)AR.M.injectForeign(DATA,AR.A);
const READY=DATA.ready||DATA.gc.map((_,i)=>i+1),LASTH=READY[READY.length-1];
const PARS=DATA.par||READY.map(()=>3);
const hNum=READY.includes(parseInt(Q.get("h")))?parseInt(Q.get("h")):READY[0];
const TEE_N=DATA.teeNames||["biele","žlté","červené"],TEE_C=DATA.teeColors||["#fff","#ffd400","#e0312b"];
const tIdx=Math.min(TEE_N.length-1,Math.max(0,parseInt(Q.get("t"))||0));
const PAR=PARS[hNum-1]||3;
// názov klubu na loptičke a vlajke (každé ihrisko svoj)
const CLUBN={apex:"APEX"}[CRS]||"APEX";
const STYLE=(CRS==="apex"?{}:{1:{},2:{},3:{sunWest:true}}[hNum])||{};
// navigácia jamiek a odpalísk podľa dát ihriska
if(CRS==="apex"){document.getElementById("holes").innerHTML=READY.map(h=>`<a data-h="${h}">${h}</a>`).join("");
  document.getElementById("holes").classList.add("scroll");
  document.getElementById("tees").innerHTML="<span>Odpalisko:</span>"+TEE_N.map((nm,j)=>`<a data-t="${j}" title="${nm}"><i style="background:${TEE_C[j]}"></i><b>${nm}</b></a>`).join("");
  document.getElementById("tees").classList.add("many")}

// --- terén
// terén: pri 18-ke v samostatných dlaždiciach (juh / sever za diaľnicou), načíta sa len tá, ktorú jamka potrebuje
const TR=DATA.terrain||await (await fetch(DATA.tiles[DATA.holeTile[hNum]])).json(),Hcm=new Int16Array(Uint8Array.from(atob(TR.cm),c=>c.charCodeAt(0)).buffer);
function hENU(e,n){let c=(e-TR.e0)/TR.step,r=(n-TR.n0)/TR.step;c=Math.min(TR.w-1.001,Math.max(0,c));r=Math.min(TR.h-1.001,Math.max(0,r));
  const c0=c|0,r0=r|0,fc=c-c0,fr=r-r0,i=r0*TR.w+c0;
  return TR.base+(Hcm[i]*(1-fc)*(1-fr)+Hcm[i+1]*fc*(1-fr)+Hcm[i+TR.w]*(1-fc)*fr+Hcm[i+TR.w+1]*fc*fr)/100}

const T=DATA.pads[hNum][tIdx],GC=DATA.gc[hNum-1];
const dx=GC[0]-T[0],dy=GC[1]-T[1],L=Math.hypot(dx,dy),u=[dx/L,dy/L],rt=[u[1],-u[0]];
const loc=([e,n])=>[(e-T[0])*rt[0]+(n-T[1])*rt[1],(e-T[0])*u[0]+(n-T[1])*u[1]];
const enu=(x,y)=>[T[0]+x*rt[0]+y*u[0],T[1]+x*rt[1]+y*u[1]];
const H0=hENU(T[0],T[1]);
let hBump=()=>0;
const hL=(x,y)=>hENU(...enu(x,y))-H0+hBump(x,y);
const c=Math.round(L);
// predok a zadok greenu po línii hry
let green=DATA.greens[hNum-1].map(loc);
// hrubé obrysy (málo bodov) vyhladíme, aby green nemal rohy
for(let k=0;k<3&&green.length<40;k++)green=green.flatMap((p,i)=>{const q=green[(i+1)%green.length];return[[.75*p[0]+.25*q[0],.75*p[1]+.25*q[1]],[.25*p[0]+.75*q[0],.25*p[1]+.75*q[1]]]});
let ys=[];for(let i=0;i<green.length;i++){const[a,b]=green[i],[d,e]=green[(i+1)%green.length];if((a<=0)!==(d<=0)){ys.push(b+(e-b)*(0-a)/(d-a))}}
const f=Math.round(Math.min(...ys)),b=Math.round(Math.max(...ys));
// vzdialenosť bodu od obrysu (záporná vnútri)
const inPoly=(pt,poly)=>{let s=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const[a,b]=poly[i],[d,e]=poly[j];if(((b>pt[1])!==(e>pt[1]))&&(pt[0]<(d-a)*(pt[1]-b)/(e-b)+a))s=!s}return s};
function sdist(x,y,P){let m=1e9;for(let i=0,j=P.length-1;i<P.length;j=i++){const[a,b]=P[j],[d,e]=P[i],vx=d-a,vy=e-b,l=vx*vx+vy*vy;
  let t=l?((x-a)*vx+(y-b)*vy)/l:0;t=t<0?0:t>1?1:t;const qx=a+t*vx-x,qy=b+t*vy-y;m=Math.min(m,qx*qx+qy*qy)}m=Math.sqrt(m);return inPoly([x,y],P)?-m:m}

// --- modelácia greenu na skutočnom teréne: mierny sklon odzadu dopredu, jemné vlnky (do ~30 cm),
//     zvýšené okraje pri bunkroch a mäkké hrany bunkrov
const GB=(()=>{let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(const[x,y]of green){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}return{x0,x1,y0,y1}})();
const gcx=(GB.x0+GB.x1)/2,gcy=(GB.y0+GB.y1)/2;
const myBunkers=[];
const BUMPS=[[3.5,4,4.2,.13],[-4,-3,3.6,-.09],[-3,4.5,3.2,.08],[4,-5,3,-.06]];
// green: terén pod ním vyrovnáme do mierne sklonenej roviny (max ~2 %), pri jamke ešte rovnejšie – ako na skutočnom greene
const raw=(x,y)=>hENU(...enu(x,y))-H0;
const GP=(()=>{const e=5,h0=raw(gcx,gcy);let sx=(raw(gcx+e,gcy)-raw(gcx-e,gcy))/(2*e),sy=(raw(gcx,gcy+e)-raw(gcx,gcy-e))/(2*e)+.011;const m=Math.hypot(sx,sy),mx=.015;if(m>mx){sx*=mx/m;sy*=mx/m}return{h0,sx,sy}})();
// odpaliská 18-ky: rovná, mierne vyvýšená plošina (DMR pod nimi býva naklonený / pri jazere zapadnutý) s mäkkým svahom 3 m
const TEEPL=CRS==="apex"?(()=>{const out=[],src=[...(DATA.teeboxes||[]).map(T=>T.p.map(loc))];
  const pd=(DATA.pads[hNum]||[]).map(loc);for(const[px,py]of pd)if(!src.some(P=>inPoly([px,py],P)))src.push([...Array(12)].map((_,i)=>[px+3.2*Math.cos(i*Math.PI/6),py+3.2*Math.sin(i*Math.PI/6)]));
  for(const P of src){let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(const[x,y]of P){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}
    if(x1<-400||x0>400||y1<-120||y0>c+150)continue;const hs=[];for(let x=x0;x<=x1;x+=.7)for(let y=y0;y<=y1;y+=.7)if(inPoly([x,y],P))hs.push(raw(x,y));if(!hs.length)continue;
    hs.sort((a,b)=>a-b);out.push({P,bb:[x0-3,x1+3,y0-3,y1+3],z:hs[Math.floor(hs.length*.8)]+.3})}return out})():[];
// v255: chodníky – terén pod nimi zarovnaný na vyhladený profil (lib/areal.js pathLevel, zdieľaný s okolím); odpalisko má prednosť
