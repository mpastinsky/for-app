<script type="module">
import * as THREE from "three";
import {OrbitControls} from "./lib/OrbitControls.js";

// Akadémia Apex Golf, Báč. Terén z DMR 5.0 (ÚGKK SR, CC BY 4.0), greeny/bunkre/stromy obkreslené zo satelitu
// a zarovnané na terén. Dáta: akademia.json (ENU metre od greenu 1, x = východ, y = sever).
const DATA=await (await fetch("akademia.json")).json();
const Q=new URLSearchParams(location.search);
const hNum=Math.min(3,Math.max(1,parseInt(Q.get("h"))||1));
const tIdx=Math.min(2,Math.max(0,parseInt(Q.get("t"))||0));
const TEE_N=["biele","žlté","červené"];
const STYLE={1:{},2:{},3:{sunWest:true}}[hNum];

// --- terén
const TR=DATA.terrain,Hcm=new Int16Array(Uint8Array.from(atob(TR.cm),c=>c.charCodeAt(0)).buffer);
function hENU(e,n){let c=(e-TR.e0)/TR.step,r=(n-TR.n0)/TR.step;c=Math.min(TR.w-1.001,Math.max(0,c));r=Math.min(TR.h-1.001,Math.max(0,r));
  const c0=c|0,r0=r|0,fc=c-c0,fr=r-r0,i=r0*TR.w+c0;
  return TR.base+(Hcm[i]*(1-fc)*(1-fr)+Hcm[i+1]*fc*(1-fr)+Hcm[i+TR.w]*(1-fc)*fr+Hcm[i+TR.w+1]*fc*fr)/100}

// --- lokálny rámec jamky: odpalisko (0,0), y = smer na stred greenu, x = vpravo
const T=DATA.pads[hNum][tIdx],GC=DATA.gc[hNum-1];
const dx=GC[0]-T[0],dy=GC[1]-T[1],L=Math.hypot(dx,dy),u=[dx/L,dy/L],rt=[u[1],-u[0]];
const loc=([e,n])=>[(e-T[0])*rt[0]+(n-T[1])*rt[1],(e-T[0])*u[0]+(n-T[1])*u[1]];
const enu=(x,y)=>[T[0]+x*rt[0]+y*u[0],T[1]+x*rt[1]+y*u[1]];
const H0=hENU(T[0],T[1]);
let hBump=()=>0;
const hL=(x,y)=>hENU(...enu(x,y))-H0+hBump(x,y);
const c=Math.round(L);
// predok a zadok greenu po línii hry
let green=DATA.greens[hNum-1].map(loc);
// hrubé obrysy (málo bodov) vyhladíme, aby green nemal rohy
for(let k=0;k<3&&green.length<40;k++)green=green.flatMap((p,i)=>{const q=green[(i+1)%green.length];return[[.75*p[0]+.25*q[0],.75*p[1]+.25*q[1]],[.25*p[0]+.75*q[0],.25*p[1]+.75*q[1]]]});
let ys=[];for(let i=0;i<green.length;i++){const[a,b]=green[i],[d,e]=green[(i+1)%green.length];if((a<=0)!==(d<=0)){ys.push(b+(e-b)*(0-a)/(d-a))}}
const f=Math.round(Math.min(...ys)),b=Math.round(Math.max(...ys));
// vzdialenosť bodu od obrysu (záporná vnútri)
const inPoly=(pt,poly)=>{let s=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const[a,b]=poly[i],[d,e]=poly[j];if(((b>pt[1])!==(e>pt[1]))&&(pt[0]<(d-a)*(pt[1]-b)/(e-b)+a))s=!s}return s};
function sdist(x,y,P){let m=1e9;for(let i=0,j=P.length-1;i<P.length;j=i++){const[a,b]=P[j],[d,e]=P[i],vx=d-a,vy=e-b,l=vx*vx+vy*vy;
  let t=l?((x-a)*vx+(y-b)*vy)/l:0;t=t<0?0:t>1?1:t;const qx=a+t*vx-x,qy=b+t*vy-y;m=Math.min(m,qx*qx+qy*qy)}m=Math.sqrt(m);return inPoly([x,y],P)?-m:m}
const sstep=t=>t<=0?0:t>=1?1:t*t*(3-2*t);
// --- modelácia greenu na skutočnom teréne: mierny sklon odzadu dopredu, jemné vlnky (do ~30 cm),
//     zvýšené okraje pri bunkroch a mäkké hrany bunkrov
const GB=(()=>{let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(const[x,y]of green){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}return{x0,x1,y0,y1}})();
const gcx=(GB.x0+GB.x1)/2,gcy=(GB.y0+GB.y1)/2;
const myBunkers=[];
const BUMPS=[[3.5,4,4.2,.13],[-4,-3,3.6,-.09],[-3,4.5,3.2,.08],[4,-5,3,-.06]];
hBump=(x,y)=>{const M=9;if(x<GB.x0-M||x>GB.x1+M||y<GB.y0-M||y>GB.y1+M)return 0;
  let h=0;const sd=sdist(x,y,green);const w=sd<=0?1:1-sstep(sd/4.5);
  if(w>0){h+=w*.011*(y-gcy);for(const[bx,by,sg,a]of BUMPS){const dx=x-gcx-bx,dy=y-gcy-by;h+=w*a*Math.exp(-(dx*dx+dy*dy)/(2*sg*sg))}}
  for(const B of myBunkers){const d=sdist(x,y,B);if(d>4)continue;
    if(d>=0){h+=.2*Math.exp(-(((d-.9)/.8)**2))*(sd<6?1:.5)}else{h-=.14*sstep(-d/1.5)}}
  return h};
const hG=hL(0,c);
const cen=P=>[P.reduce((a,p)=>a+p[0],0)/P.length,P.reduce((a,p)=>a+p[1],0)/P.length];
const nearestGreen=B=>{const q=cen(B);let bi=0,bd=1e9;DATA.gc.forEach((g,i)=>{const d=(g[0]-q[0])**2+(g[1]-q[1])**2;if(d<bd){bd=d;bi=i}});return bi};
for(const B of DATA.bunkers)if(nearestGreen(B)===hNum-1)myBunkers.push(B.map(loc));
document.getElementById("h-t").textContent="Jamka "+hNum+" · Par 3";
document.getElementById("h-s").textContent=TEE_N[tIdx]+" · "+f+" / "+c+" / "+b+" m";
document.querySelectorAll("#holes a").forEach(a=>{a.href="?h="+a.dataset.h+"&t="+tIdx;a.classList.toggle("on",+a.dataset.h===hNum)});
document.querySelectorAll("#tees a").forEach(a=>{a.href="?h="+hNum+"&t="+a.dataset.t;a.classList.toggle("on",+a.dataset.t===tIdx)});
document.getElementById("note").textContent="Terén © ÚGKK SR, DMR 5.0 (CC BY 4.0)";

// --- scéna
const scene=new THREE.Scene();
const sky=STYLE.sunWest?0xc9dbe8:0x9fc6e8;
scene.background=new THREE.Color(sky);scene.fog=new THREE.Fog(sky,350,900);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,1,1500);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
const W=(x,y,h)=>new THREE.Vector3(x,h,-y);          // svet: X vpravo, Y hore, -Z dopredu
const hemi=new THREE.HemisphereLight(0xdff1ff,0x3a5a2a,STYLE.sunWest?1.9:1.15);scene.add(hemi);
const sun=new THREE.DirectionalLight(STYLE.sunWest?0xfff1d6:0xffffff,STYLE.sunWest?1.25:1.6);
// slnko: z juhu (poobede), pri jamke 3 večer zo západu
const sunDir=STYLE.sunWest?[-1,0.15]:[0.3,-1];const sl=loc([T[0]+sunDir[0]*200,T[1]+sunDir[1]*200]);
sun.position.copy(W(sl[0],sl[1],170));sun.target.position.copy(W(0,c*.5,0));sun.castShadow=true;
Object.assign(sun.shadow.camera,{left:-220,right:220,top:220,bottom:-220,near:1,far:800});sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-0.0003;sun.shadow.normalBias=0.5;
scene.add(sun,sun.target);

// --- terén + "namaľovaný" povrch (rough, fairway, greeny, bunkre, odpaliská)
const X0=-170,X1=170,Y0=-70,Y1=c+150,SEG=2;
const geo=new THREE.PlaneGeometry(X1-X0,Y1-Y0,(X1-X0)/SEG,(Y1-Y0)/SEG);geo.rotateX(-Math.PI/2);
geo.translate((X0+X1)/2,0,-(Y0+Y1)/2);
{const p=geo.attributes.position;for(let i=0;i<p.count;i++){p.setY(i,hL(p.getX(i),-p.getZ(i)))}geo.computeVertexNormals()}
const TEX=2048,cv=document.createElement("canvas");cv.width=cv.height=TEX;const g2=cv.getContext("2d");
const tx=x=>(x-X0)/(X1-X0)*TEX,ty=y=>(Y1-y)/(Y1-Y0)*TEX,ppm=TEX/(X1-X0);
function path(P){g2.beginPath();P.forEach(([x,y],i)=>i?g2.lineTo(tx(x),ty(y)):g2.moveTo(tx(x),ty(y)));g2.closePath()}
g2.fillStyle=STYLE.dry?"#b3ad66":"#86a352";g2.fillRect(0,0,TEX,TEX);
// textúra trávy: náhodné škvrny
let seed=7+hNum*13;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
for(let k=0;k<2500;k++){g2.fillStyle=STYLE.dry?(rnd()<.5?"rgba(150,150,80,.10)":"rgba(210,200,140,.10)"):(rnd()<.5?"rgba(90,130,50,.10)":"rgba(150,180,90,.10)");
  const r=(2+rnd()*6)*ppm/3;g2.beginPath();g2.arc(rnd()*TEX,rnd()*TEX,r,0,7);g2.fill()}
// pokosené plochy: podľa leteckých záberov (jamky 1 a 2), inak odhad
const MOW=DATA.mow&&DATA.mow[hNum];
if(MOW){for(const poly of MOW.slice().reverse()){const P=poly.map(loc);g2.save();path(P);g2.clip();g2.fillStyle="#74b04a";g2.fillRect(0,0,TEX,TEX);
  g2.fillStyle="rgba(40,90,25,.16)";for(let y=-20;y<c+30;y+=12){const a=ty(y),b2=ty(y+6);g2.fillRect(0,Math.min(a,b2),TEX,Math.abs(a-b2))}g2.restore()}}
else{const y0=22,y1=f-2,w=12;g2.save();g2.beginPath();g2.moveTo(tx(-w),ty(y0+8));g2.quadraticCurveTo(tx(-w),ty(y0),tx(0),ty(y0));g2.quadraticCurveTo(tx(w),ty(y0),tx(w),ty(y0+8));
 g2.lineTo(tx(w+2),ty(y1-6));g2.quadraticCurveTo(tx(w),ty(y1+2),tx(0),ty(y1+2));g2.quadraticCurveTo(tx(-w),ty(y1+2),tx(-w-2),ty(y1-6));g2.closePath();g2.clip();
 g2.fillStyle="#74b04a";g2.fillRect(0,0,TEX,TEX);g2.fillStyle="rgba(40,90,25,.18)";for(let y=y0;y<y1+4;y+=12){const a=ty(y),b2=ty(y+6);g2.fillRect(0,Math.min(a,b2),TEX,Math.abs(a-b2))}g2.restore()}
// greeny: lem (fringe) + plocha
// farby trávnika okolo greenu (detail v jemnej textúre nižšie)
const TURF={cut:"#7cba4b",collar:"#8bcb55",green:"#9fd95e"};
g2.lineJoin="round";path(green);g2.lineWidth=8*ppm;g2.strokeStyle=TURF.cut;g2.stroke();g2.fillStyle=TURF.cut;g2.fill();
path(green);g2.lineWidth=3*ppm;g2.strokeStyle=TURF.collar;g2.stroke();g2.fillStyle=TURF.green;g2.fill();
// bunkre
for(const B of DATA.bunkers){if(nearestGreen(B)!==hNum-1)continue;const P=B.map(loc);path(P);g2.fillStyle="#eadcae";g2.fill();g2.lineWidth=.6*ppm;g2.strokeStyle="#c8b88a";g2.stroke()}
// odpaliská
for(const k of [String(hNum)])DATA.pads[k].forEach((p,j)=>{const[x,y]=loc(p);g2.beginPath();g2.arc(tx(x),ty(y),4.5*ppm,0,7);
  g2.fillStyle=(+k===hNum&&j===tIdx)?"#a7e874":(+k===hNum?"#8fd062":"#86c45a");g2.fill();g2.lineWidth=.5*ppm;g2.strokeStyle="#5d9a3c";g2.stroke()});
// tieňovanie reliéfu (aby boli kopčeky vidno aj zhora)
{const ww=X1-X0,hh=Y1-Y0,sc2=document.createElement("canvas");sc2.width=ww;sc2.height=hh;const sx=sc2.getContext("2d"),im=sx.createImageData(ww,hh);
 const L0=[-0.5,0.55,0.67];const ex=1.6;
 for(let j=0;j<hh;j++){const y=Y1-j-.5;for(let i=0;i<ww;i++){const x=X0+i+.5;
   const gx=(hL(x+1,y)-hL(x-1,y))/2*ex,gy=(hL(x,y+1)-hL(x,y-1))/2*ex,n=Math.hypot(gx,gy,1);
   const v=Math.max(0,(-gx*L0[0]-gy*L0[1]+L0[2])/n)/L0[2];const k=(j*ww+i)*4;const val=Math.max(0,Math.min(255,128+(v-1)*300));
   im.data[k]=im.data[k+1]=im.data[k+2]=val;im.data[k+3]=255}}
 sx.putImageData(im,0,0);g2.save();g2.globalCompositeOperation="soft-light";g2.globalAlpha=.7;g2.drawImage(sc2,0,0,TEX,TEX);g2.restore()}
const tex=new THREE.CanvasTexture(cv);tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=renderer.capabilities.getMaxAnisotropy();
{const p=geo.attributes.position,uv=geo.attributes.uv;for(let i=0;i<p.count;i++){uv.setXY(i,(p.getX(i)-X0)/(X1-X0),(-p.getZ(i)-Y0)/(Y1-Y0))}}
const ground=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({map:tex,roughness:1}));ground.receiveShadow=true;scene.add(ground);
// --- green v detaile: vlastná jemná sieť (0,5 m) a textúra s pruhmi, lemom a prvým kosom
const PIN=[0,c];
{const M=7,gx0=Math.floor(GB.x0-M),gx1=Math.ceil(GB.x1+M),gy0=Math.floor(GB.y0-M),gy1=Math.ceil(GB.y1+M),gw=gx1-gx0,gh=gy1-gy0,st=.5;
 const gg=new THREE.PlaneGeometry(gw,gh,gw/st,gh/st);gg.rotateX(-Math.PI/2);gg.translate((gx0+gx1)/2,0,-(gy0+gy1)/2);
 {const p=gg.attributes.position,uv=gg.attributes.uv;for(let i=0;i<p.count;i++){const x=p.getX(i),y=-p.getZ(i);p.setY(i,hL(x,y)+.08);uv.setXY(i,(x-gx0)/gw,(y-gy0)/gh)}gg.computeVertexNormals()}
 const N=1024,cA=document.createElement("canvas");cA.width=cA.height=N;const a=cA.getContext("2d");
 const px=x=>(x-gx0)/gw*N,py=y=>(gy1-y)/gh*N,pm=N/gw,pmy=N/gh;a.setTransform(pm,0,0,-pmy,-gx0*pm,gy1*pmy);   // kreslíme priamo v metroch
 const pth=P=>{a.beginPath();P.forEach(([x,y],i)=>i?a.lineTo(x,y):a.moveTo(x,y));a.closePath()};a.lineJoin="round";
 // prvý kos (mäkko do stratena), lem 1,5 m, plocha
 for(const[lw,al]of[[10,.25],[9.2,.5],[8.6,.8],[8,1]]){a.globalAlpha=al;pth(green);a.lineWidth=lw;a.strokeStyle=TURF.cut;a.stroke()}
 a.globalAlpha=1;pth(green);a.fillStyle=TURF.cut;a.fill();
 pth(green);a.lineWidth=3;a.strokeStyle=TURF.collar;a.stroke();
 // jemné pruhy prvého kosu (po smere hry)
 a.save();a.beginPath();a.rect(gx0,gy0,gw,gh);pth(green);a.clip("evenodd");a.globalAlpha=.06;a.fillStyle="#1e4a12";for(let x=gx0;x<gx1;x+=3)a.fillRect(x,gy0,1.5,gh);a.restore();
 pth(green);a.fillStyle=TURF.green;a.fill();
 // šachovnica kosenia na greene (uhlopriečne, pásy 1,6 m)
 a.save();pth(green);a.clip();a.translate(gcx,gcy);a.rotate(Math.PI/4);
 for(let i=-24;i<24;i++)for(let j=-24;j<24;j++){a.fillStyle=((i+j)&1)?"rgba(255,255,235,.085)":"rgba(20,70,10,.06)";a.fillRect(i*1.6,j*1.6,1.6,1.6)}
 a.restore();
 // zrnitosť trávy
 a.save();
 let sd2=91;const r2=()=>(sd2=(sd2*16807)%2147483647)/2147483647;
 for(let k=0;k<9000;k++){a.fillStyle=r2()<.5?"rgba(255,255,255,.05)":"rgba(0,40,0,.06)";a.fillRect(gx0+r2()*gw,gy0+r2()*gh,.12,.12)}a.restore();
 // okraj greenu: tenká tmavšia linka medzi lemom a plochou
 pth(green);a.lineWidth=.12;a.strokeStyle="rgba(40,90,20,.35)";a.stroke();
 // jamka
 a.beginPath();a.arc(PIN[0],PIN[1],.16,0,7);a.fillStyle="rgba(60,110,40,.35)";a.fill();
 // bunkre: piesok ostáva z hlavnej textúry, okraj mäkko

    const last=hNum===3;const nx=`?h=${hNum+1}&t=${tIdx}&play=1&sc=${all.join("-")}`;
    $("p-res").innerHTML=`<h2>${last?"Koniec kola":"Jamka "+hNum+" dohraná"}</h2><div>${last?"Spolu "+tot+" úderov · "+(dd===0?"na par":dd>0?"+"+dd+" nad par":dd+" pod par"):"Zatiaľ "+tot+" · "+(dd===0?"na par":dd>0?"+"+dd:dd)}</div>
      <table><tr><th></th><th></th><th>Údery</th></tr>${rows}<tr><td><b>Spolu</b></td><td>Par ${par}</td><td><b>${tot}</b></td></tr></table>
      ${last?`<a class="go" href="?h=1&t=${tIdx}&play=1">Hrať znova</a>`:`<a class="go" href="${nx}">Ďalšia jamka ›</a>`}
      <a class="go alt" href="?h=${hNum}&t=${tIdx}&play=1${SC.length?"&sc="+SC.join("-"):""}">Zopakovať jamku</a><a class="go alt" href="?h=${hNum}&t=${tIdx}">Ukončiť hru</a>`;
    $("p-res").hidden=false}
  function penalty(t){S.strokes++;S.x=S.prev[0];S.y=S.prev[1];S.z=gS(S.x,S.y)+R;msg(t);setTimeout(()=>{if(S.mode!=="in")prepare()},900);S.mode="wait"}
  function stopBall(){S.vx=S.vy=0;S.mode="wait";const sf=surf(S.x,S.y);
    msg(sf===SURF.green?"Na greene":sf===SURF.sand?"V bunkri":sf===SURF.rough?"V roughu":sf===SURF.collar?"Na lemu greenu":"Na "+sf.n);
    setTimeout(()=>{if(S.mode==="wait")prepare()},900)}
  function step(dt){
    if(S.mode==="fly"){S.vz-=G*dt;
      // jemný odpor vzduchu
      const sp=Math.hypot(S.vx,S.vy,S.vz),kd=.0016*sp;S.vx-=S.vx*kd*dt;S.vy-=S.vy*kd*dt;S.vz-=S.vz*kd*dt;
      S.x+=S.vx*dt;S.y+=S.vy*dt;S.z+=S.vz*dt;
      for(const o of OBST){const dx=S.x-o.x,dy=S.y-o.y;if(dx*dx+dy*dy<o.r*o.r&&S.z>o.z0&&S.z<o.z1){S.vx*=.15;S.vy*=.15;S.vz=Math.min(S.vz,0)*.3;msg("Strom!")}}
      const g=gS(S.x,S.y)+R;if(S.z<=g){S.z=g;const sf=surf(S.x,S.y);
        if(sf===SURF.sand){S.vx=S.vy=S.vz=0;stopBall();return}
        S.vz=-S.vz*sf.r;S.vx*=sf.k;S.vy*=sf.k;if(S.vz<1.2){S.vz=0;S.mode="roll"}}}
    else if(S.mode==="roll"){const sf=surf(S.x,S.y),[gx,gy]=grad(S.x,S.y),sp=Math.hypot(S.vx,S.vy);
      let ax=-G*gx*.71,ay=-G*gy*.71;
      if(sp>1e-3){ax-=sf.f*S.vx/sp;ay-=sf.f*S.vy/sp}
      const nvx=S.vx+ax*dt,nvy=S.vy+ay*dt;
      if(sp<.06&&Math.hypot(G*gx*.71,G*gy*.71)<sf.f){stopBall();return}
      if(nvx*S.vx+nvy*S.vy<0&&Math.hypot(G*gx*.71,G*gy*.71)<sf.f){stopBall();return}
      S.vx=nvx;S.vy=nvy;S.x+=S.vx*dt;S.y+=S.vy*dt;S.z=gS(S.x,S.y)+R;
      const dc=Math.hypot(S.x-PIN[0],S.y-PIN[1]);if(dc<.07&&sp<1.6){holed();return}
      if(dc<.1&&sp<.5){holed();return}}
    if(S.mode==="fly"||S.mode==="roll"){S.t+=dt;
      if(S.x<X0+3||S.x>X1-3||S.y<Y0+3||S.y>Y1-3){penalty("Mimo ihriska · trestná rana");return}
      if(S.t>25)stopBall()}}
  // kamera
  const camP=new THREE.Vector3(),camT=new THREE.Vector3();
  function camGoal(){const dx=Math.sin(S.aim),dy=Math.cos(S.aim);const onG=sdist(S.x,S.y,green)<4;
    if(S.mode==="fly"||S.mode==="roll"){const d=Math.max(1,Math.hypot(S.vx,S.vy));const fx=S.vx/d,fy=S.vy/d;
      if(S.mode==="fly"&&S.vz>0){const bk=12;return[[S.prev[0]-dx*bk,S.prev[1]-dy*bk,gS(S.prev[0],S.prev[1])+4],[S.x,S.y,S.z]]}
      return[[S.x-fx*7-1,S.y-fy*7,S.z+3],[S.x,S.y,S.z]]}
    if(S.view===1){return[[S.x-dx*20,S.y-dy*20,S.z+40],[S.x+dx*Math.min(toPin(),120)*.6,S.y+dy*Math.min(toPin(),120)*.6,gS(PIN[0],PIN[1])]]}
    if(onG){const L=Math.min(Math.max(toPin(),2),12);return[[S.x-dx*4.5,S.y-dy*4.5,S.z+1.7],[S.x+dx*L,S.y+dy*L,gS(S.x+dx*L,S.y+dy*L)]]}
    return[[S.x-dx*9,S.y-dy*9,S.z+3.2],[S.x+dx*40,S.y+dy*40,gS(S.x+dx*40,S.y+dy*40)+1]]}
  function camUpd(dt,snap){const[p,t]=camGoal();const P=W(p[0],p[1],Math.max(p[2],gS(p[0],p[1])+1.2)),T=W(...t);
    const k=snap?1:1-Math.exp(-dt*(S.mode==="fly"?2.2:4));camP.lerp(P,k);camT.lerp(T,k);camera.position.copy(camP);camera.lookAt(camT)}
  // ovládanie
  let hold=null,turn=0;
  const powOf=t=>{const ph=(t/1400)%2;return ph<1?ph:2-ph};
  $("p-hit").addEventListener("pointerdown",e=>{if(S.mode!=="aim")return;e.preventDefault();hold=performance.now();$("p-hit").setPointerCapture(e.pointerId)});
  const rel=e=>{if(hold==null)return;const p=Math.max(.04,powOf(performance.now()-hold));hold=null;$("p-pow").style.width="0";shoot(p)};
  $("p-hit").addEventListener("pointerup",rel);$("p-hit").addEventListener("pointercancel",()=>{hold=null;$("p-pow").style.width="0"});
  for(const[id,dv]of[["p-l",-1],["p-r",1]]){const b=$(id);b.addEventListener("pointerdown",e=>{e.preventDefault();turn=dv});for(const ev of["pointerup","pointerleave","pointercancel"])b.addEventListener(ev,()=>{turn=0})}
  $("p-cp").onclick=()=>{if(S.mode!=="aim")return;S.club=Math.min(CLUBS.length-1,S.club+1);info();drawAim()};
  $("p-cm").onclick=()=>{if(S.mode!=="aim")return;S.club=Math.max(0,S.club-1);info();drawAim()};
  $("p-v").onclick=()=>{S.view=1-S.view};
  // potiahnutie prstom po scéne = mierenie
  let drag=null;renderer.domElement.addEventListener("pointerdown",e=>{drag=e.clientX});
  addEventListener("pointermove",e=>{if(drag==null||S.mode!=="aim")return;S.aim+=(e.clientX-drag)*.0025;drag=e.clientX;drawAim()});
  addEventListener("pointerup",()=>{drag=null});
  game={update(dt){
      if(turn&&S.mode==="aim"){S.aim+=turn*dt*.35;drawAim()}
      if(hold!=null){const p=powOf(performance.now()-hold);$("p-pow").style.width=(p*100)+"%";const cl=CLUBS[S.club];
        $("p-ht").textContent=cl.a?"Sila "+Math.round(p*100)+" % · ≈ "+Math.round(cl.c*S.lie.m*p)+" m":"Pat ≈ "+(cl.c*p).toFixed(1).replace(".",",")+" m"}
      else if(S.mode==="aim")$("p-ht").textContent=CLUBS[S.club].a?"Drž a pusti – úder":"Drž a pusti – pat";
      const n=4;for(let i=0;i<n;i++)step(dt/n);
      if(S.mode==="fly"||S.mode==="roll"){place();if(S.tr<600){trailP.set([S.x,S.z+.05,-S.y],S.tr*3);S.tr++;trailG.setDrawRange(0,S.tr);trailG.attributes.position.needsUpdate=true}
        if(S.mode==="roll"||S.mode==="wait")info()}
      if(S.mode!=="in")camUpd(dt,false);
      ball.scale.setScalar(Math.min(2.5,Math.max(.35,camera.position.distanceTo(ball.position)/14)))}};
  document.getElementById("h-t").textContent="Jamka "+hNum+" · Par 3"+(SC.length?" · zatiaľ "+SC.reduce((a,b)=>a+b,0):"");
  prepare();{const[p,t]=camGoal();camP.copy(W(...p));camT.copy(W(...t))}camUpd(0,true);
}

let lastT=0;
function loop(now){const dt=Math.min(.05,lastT?(now-lastT)/1000:0);lastT=now;
  if(fly){const k=Math.min(1,(now-fly.t0)/9000),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    camera.position.copy(curve.getPoint(e));controls.target.copy(W(0,c,hG));if(k>=1)fly=null}
  waveFlag(now/1000);if(game)game.update(dt);else controls.update();renderer.render(scene,camera);placeLabels();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
