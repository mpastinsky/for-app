<script>/* prechody bez preblikntia: nová obrazovka (jamka / prehľad) sa načíta v rámci nad tou súčasnou
   a ukáže sa až keď má vykreslený prvý záber; stará sa potom zahodí. Odkazy mimo 3D (späť do appky) idú normálne. */
(function(){const EMB=window.parent!==window;window.__EMB=EMB;let frames=[];
 const abs=u=>new URL(u,location.href).href,in3d=u=>false;   // 3D obrazovky sa otvárajú normálnym načítaním stránky (rámce s dvoma scénami naraz sekali – Martin, v140)
 const snap=u=>{try{if(window.__snap&&/\/3d\//.test(new URL(u,location.href).pathname)){const d=window.__snap();if(d)sessionStorage.setItem("for.snap",d)}}catch(e){}};
 window.forNav=function(url){if(!in3d(url)){snap(url);(EMB?top:window).location.href=abs(url);return}
   if(window.__playHere&&window.__playHere(abs(url)))return;   // tá istá jamka → hra sa spustí hneď, bez nového načítania scény
   if(window.__freeze)window.__freeze();if(EMB){parent.postMessage({forGo:abs(url)},"*");return}openFrame(abs(url))};
 function openFrame(u){const f=document.createElement("iframe");f.src=u;f.setAttribute("allow","geolocation; accelerometer; gyroscope");
   f.style.cssText="position:fixed;left:0;top:0;width:100%;height:100%;border:0;opacity:0;z-index:1000;transition:opacity .3s;background:#5e8443";f.__url=u;document.body.appendChild(f);frames.push(f);f.__to=setTimeout(()=>{if(f.style.opacity!=="1")location.href=u},40000)}
 addEventListener("message",e=>{const d=e.data||{};if(EMB)return;
   if(d.forGo)openFrame(d.forGo);
   if(d.forReady){const f=frames.find(x=>x.contentWindow===e.source);if(!f)return;f.style.opacity="1";try{history.replaceState(null,"",f.__url)}catch(_){}
     setTimeout(()=>{frames.filter(x=>x!==f).forEach(x=>x.remove());frames=[f];if(window.__hostStop)window.__hostStop()},350)}});
 document.addEventListener("click",e=>{const a=e.target.closest&&e.target.closest("a[href]");if(!a||e.defaultPrevented||a.target||e.metaKey||e.ctrlKey)return;
   const h=a.getAttribute("href");if(!h||h[0]==="#"||/^(javascript|mailto|tel|sms|whatsapp):/i.test(h))return;e.preventDefault();forNav(h)});
})();</script>
<script>/* plynulý prechod: posledný záber predchádzajúcej obrazovky ostane viditeľný, kým sa nová scéna nevykreslí */
try{const s=sessionStorage.getItem("for.snap");if(s){sessionStorage.removeItem("for.snap");const i=document.createElement("img");i.id="snapimg";i.src=s;
 i.style.cssText="position:fixed;left:0;top:0;width:100vw;height:100vh;object-fit:cover;z-index:1;pointer-events:none;transition:opacity .35s";document.body.appendChild(i)}}catch(e){}</script>

<script type="module">
import * as THREE from "three";

// Akadémia Apex Golf, Báč. Terén z DMR 5.0 (ÚGKK SR, CC BY 4.0), greeny/bunkre/stromy obkreslené zo satelitu
// a zarovnané na terén. Dáta: akademia.json (ENU metre od greenu 1, x = východ, y = sever).
const Q=new URLSearchParams(location.search);

const PARS=DATA.par||READY.map(()=>3);
const hNum=READY.includes(parseInt(Q.get("h")))?parseInt(Q.get("h")):READY[0];

const PAR=PARS[hNum-1]||3;

const CLUBN={apex:"APEX"}[CRS]||"APEX";
const STYLE=(CRS==="apex"?{}:{1:{},2:{},3:{sunWest:true}}[hNum])||{};

if(CRS==="apex"){document.getElementById("holes").innerHTML=READY.map(h=>`<a data-h="${h}">${h}</a>`).join("");
  document.getElementById("holes").classList.add("scroll");
  document.getElementById("tees").innerHTML="<span>Odpalisko:</span>"+TEE_N.map((nm,j)=>`<a data-t="${j}" title="${nm}"><i style="background:${TEE_C[j]}"></i><b>${nm}</b></a>`).join("");
  document.getElementById("tees").classList.add("many")}

// --- terén
// terén: pri 18-ke v samostatných dlaždiciach (juh / sever za diaľnicou), načíta sa len tá, ktorú jamka potrebuje
const TR=DATA.terrain||await (await fetch(DATA.tiles[DATA.holeTile[hNum]])).json(),Hcm=new Int16Array(Uint8Array.from(atob(TR.cm),c=>c.charCodeAt(0)).buffer);
function hENU(e,n){let c=(e-TR.e0)/TR.step,r=(n-TR.n0)/TR.step;c=Math.min(TR.w-1.001,Math.max(0,c));r=Math.min(TR.h-1.001,Math.max(0,r));
  const c0=c|0,r0=r|0,fc=c-c0,fr=r-r0,i=r0*TR.w+c0;
  return TR.base+(Hcm[i]*(1-fc)*(1-fr)+Hcm[i+1]*fc*(1-fr)+Hcm[i+TR.w]*(1-fc)*fr+Hcm[i+TR.w+1]*fc*fr)/100}

// --- lokálny rámec jamky: odpalisko (0,0), y = smer na stred greenu, x = vpravo
const T=DATA.pads[hNum][tIdx],GC=DATA.gc[hNum-1];
const dx=GC[0]-T[0],dy=GC[1]-T[1],L=Math.hypot(dx,dy),u=[dx/L,dy/L],rt=[u[1],-u[0]];
const loc=([e,n])=>[(e-T[0])*rt[0]+(n-T[1])*rt[1],(e-T[0])*u[0]+(n-T[1])*u[1]];
const enu=(x,y)=>[T[0]+x*rt[0]+y*u[0],T[1]+x*rt[1]+y*u[1]];
const H0=hENU(T[0],T[1]);
let hBump=()=>0;

const c=Math.round(L);
// predok a zadok greenu po línii hry
let green=DATA.greens[hNum-1].map(loc);
// hrubé obrysy (málo bodov) vyhladíme, aby green nemal rohy
for(let k=0;k<3&&green.length<40;k++)green=green.flatMap((p,i)=>{const q=green[(i+1)%green.length];return[[.75*p[0]+.25*q[0],.75*p[1]+.25*q[1]],[.25*p[0]+.75*q[0],.25*p[1]+.75*q[1]]]});
let ys=[];for(let i=0;i<green.length;i++){const[a,b]=green[i],[d,e]=green[(i+1)%green.length];if((a<=0)!==(d<=0)){ys.push(b+(e-b)*(0-a)/(d-a))}}
const f=Math.round(Math.min(...ys)),b=Math.round(Math.max(...ys));
// vzdialenosť bodu od obrysu (záporná vnútri)
const inPoly=(pt,poly)=>{let s=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const[a,b]=poly[i],[d,e]=poly[j];if(((b>pt[1])!==(e>pt[1]))&&(pt[0]<(d-a)*(pt[1]-b)/(e-b)+a))s=!s}return s};
function sdist(x,y,P){let m=1e9;for(let i=0,j=P.length-1;i<P.length;j=i++){const[a,b]=P[j],[d,e]=P[i],vx=d-a,vy=e-b,l=vx*vx+vy*vy;
  let t=l?((x-a)*vx+(y-b)*vy)/l:0;t=t<0?0:t>1?1:t;const qx=a+t*vx-x,qy=b+t*vy-y;m=Math.min(m,qx*qx+qy*qy)}m=Math.sqrt(m);return inPoly([x,y],P)?-m:m}

const raw=(x,y)=>hENU(...enu(x,y))-H0;

  for(const B of myBunkers){const bb=B.bb;if(x<bb[0]||x>bb[1]||y<bb[2]||y>bb[3])continue;const d=sdist(x,y,B);if(d>4)continue;
    if(d>=0){h+=.2*Math.exp(-(((d-.9)/.8)**2))*(B.gd<6?1:.5)}else{h-=.14*sstep(-d/1.5)}}
  if(x<GB.x0-M||x>GB.x1+M||y<GB.y0-M||y>GB.y1+M)return h;
  const sd=sdist(x,y,green);const w=sd<=0?1:1-sstep(sd/4.5);
  if(w>0){const pl=GP.h0+GP.sx*(x-gcx)+GP.sy*(y-gcy);h+=w*(pl-raw(x,y));const dp=Math.hypot(x,y-c),fl=.2+.8*sstep(Math.min(1,dp/5));
    for(const[bx,by,sg,a]of BUMPS){const dx=x-gcx-bx,dy=y-gcy-by;h+=w*fl*a*Math.exp(-(dx*dx+dy*dy)/(2*sg*sg))}}
  return h};
const hG=hL(0,c);
const cen=P=>[P.reduce((a,p)=>a+p[0],0)/P.length,P.reduce((a,p)=>a+p[1],0)/P.length];
const nearestGreen=B=>{const q=cen(B);let bi=0,bd=1e9;DATA.gc.forEach((g,i)=>{if(!g)return;const d=(g[0]-q[0])**2+(g[1]-q[1])**2;if(d<bd){bd=d;bi=i}});return bi};
for(const B of DATA.bunkers)if(nearestGreen(B)===hNum-1)myBunkers.push(B.map(loc));

document.getElementById("h-t").textContent="Jamka "+hNum+" · Par "+PAR;
const BD=DATA.bend&&DATA.bend[hNum]?loc(DATA.bend[hNum]):null,cP=BD?Math.round(Math.hypot(...BD)+Math.hypot(BD[0],c-BD[1])):c;
document.getElementById("h-s").textContent=TEE_N[tIdx]+" · "+(f+cP-c)+" / "+cP+" / "+(b+cP-c)+" m";
document.querySelectorAll("#holes a").forEach(a=>{a.href="?"+CQ+"h="+a.dataset.h+"&t="+tIdx;a.classList.toggle("on",+a.dataset.h===hNum)});
{const hs=document.getElementById("holes"),on=hs.querySelector("a.on");if(on&&hs.classList.contains("scroll"))hs.scrollLeft=on.offsetLeft-hs.offsetLeft-hs.clientWidth/2+on.offsetWidth/2}
document.querySelectorAll("#tees a").forEach(a=>{a.href="?"+CQ+"h="+hNum+"&t="+a.dataset.t;a.classList.toggle("on",+a.dataset.t===tIdx)});
document.getElementById("note").textContent="Terén © ÚGKK SR, DMR 5.0 (CC BY 4.0)";

// --- scéna
const scene=new THREE.Scene();
const sky=STYLE.sunWest?0xd9e3ea:0xc4dbee,skyTop=STYLE.sunWest?0x6f9bd0:0x4f8fd8;
scene.background=new THREE.Color(sky);scene.fog=new THREE.Fog(HQ?0xa6b9a6:sky,Math.max(350,c+120),Math.max(900,c+550));
// obloha: jedna guľa s textúrou nakreslenou raz pri načítaní – prechod od obzoru do modra + prirodzené biele kopovité oblaky (nehýbu sa).
// Oblaky sa počítajú ako šum na rovine vo výške nad ihriskom, premietnutej na oblohu, takže pri obzore sú menšie a riedke ako v skutočnosti.
{const Wd=1024,Hh=256,cv=document.createElement("canvas");cv.width=Wd;cv.height=Hh*2;const x=cv.getContext("2d"),im=x.createImageData(Wd,Hh),o=im.data;
 const cA=new THREE.Color(sky),cB=new THREE.Color(skyTop);let sd=(CRS==="apex"?77:11)+hNum*131;const rnd=()=>((sd=(sd*16807)%2147483647)/2147483647);
 const P=new Uint8Array(512),pm=[...Array(256).keys()];for(let i=255;i>0;i--){const j=Math.floor(rnd()*(i+1));[pm[i],pm[j]]=[pm[j],pm[i]]}for(let i=0;i<512;i++)P[i]=pm[i&255];
 const sm=t=>t*t*(3-2*t),vn=(X,Y)=>{const xi=Math.floor(X),yi=Math.floor(Y),fx=sm(X-xi),fy=sm(Y-yi),a=P[(P[xi&255]+yi)&511],b=P[(P[(xi+1)&255]+yi)&511],c2=P[(P[xi&255]+yi+1)&511],d=P[(P[(xi+1)&255]+yi+1)&511];

function repGuard(k,pt,me,acc,onCourse){if(TESTMODE())return null;

  if(!onCourse(me))return "Hlásiť sa dá len na ihrisku.";

     const cp=camera.position,gh=hL(cp.x,-cp.z)+.45;if(cp.y<gh){cp.y=gh;camera.lookAt(controls.target)}}}{const ch=camera.position.y-hL(camera.position.x,-camera.position.z);for(const l of OTHL)l.visible=ch>25}fadeTrees();if(BLADES){camera.getWorldDirection(_bv);_bv.y=0;_bv.normalize();const cp=camera.position;BLADES.tick(now/1000,cp.x,-cp.z,_bv.x,-_bv.z,cp.y-hL(cp.x,-cp.z))}if(!window.__hold)renderer.render(scene,camera);if(!snapDone)requestAnimationFrame(snapOff);placeLabels();repTick();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
// shadery pre všetko, čo sa ukáže až neskôr (steblá trávy pri zemi, efekty), sa pripravia hneď po načítaní –
// inak sa kompilovali uprostred preletu ku jamke a obraz sa na chvíľu zasekol
function preAll(fade){if(window.__stopped)return null;const hid=[];scene.traverse(o=>{if(!o.visible){hid.push(o);o.visible=true}});
  // aj priesvitná verzia lístia (stromy medzi kamerou a jamkou sa pri prelete zprehľadnia)
  const fm=[];if(fade)for(const f of FADE)for(const m of f.m){const M=m.material;if(!M.transparent){fm.push(M);M.transparent=true;M.depthWrite=false;M.needsUpdate=true}}
  let p=null;try{if(fm.length)renderer.compile(scene,camera);for(const M of fm){M.transparent=false;M.depthWrite=true;M.needsUpdate=true}
    p=renderer.compileAsync?renderer.compileAsync(scene,camera):(renderer.compile(scene,camera),null)}catch(e){for(const M of fm){M.transparent=false;M.depthWrite=true;M.needsUpdate=true}}for(const o of hid)o.visible=false;
  if(p&&p.catch)p.catch(()=>{});return p}
setTimeout(()=>preAll(true),400);
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
// kvalita grafiky podľa výkonu: na telefóne začína strednou (menšie rozlíšenie, menej stebiel); ak je stále pod ~40 fps, zníži sa ešte o stupeň
// (rozlíšenie 1×, ešte menej stebiel, menšia mapa tieňov). Počas hry sa späť nezvyšuje, aby obraz neskákal. ?q=0/1/2 vynúti stupeň.
const QLV=[{pr:2,bl:1},{pr:1.5,bl:.55},{pr:1,bl:.3,sh:1024}],QF={l:-1,n:0,t:0,warm:0};
function setQL(l){l=Math.max(0,Math.min(2,l));if(l===QF.l)return;QF.l=l;const q=QLV[l];renderer.setPixelRatio(Math.min(devicePixelRatio,q.pr));renderer.setSize(innerWidth,innerHeight);
  if(BLADES)BLADES.setQ(q.bl);if(q.sh&&sun.shadow.mapSize.x>q.sh){sun.shadow.mapSize.set(q.sh,q.sh);if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null}}}
const MOBILE=matchMedia("(pointer:coarse)").matches||/iPhone|iPad|Android/i.test(navigator.userAgent);
setQL(Q.has("q")?+Q.get("q"):MOBILE?1:0);
function qTick(dt){if(Q.has("q")||QF.l>=2||!dt)return;QF.warm+=dt;if(QF.warm<3)return;QF.n++;QF.t+=dt;
  if(QF.t>=2){const fps=QF.n/QF.t;QF.n=0;QF.t=0;if(fps<40)setQL(QF.l+1)}}
// skrytý diagnostický panel (?fps=1): fps, najdlhší snímok, draw cally, trojuholníky, rozlíšenie, stupeň kvality, čas načítania
const FPS=Q.has("fps")?(()=>{const d=document.createElement("div");d.style.cssText="position:fixed;right:6px;top:calc(env(safe-area-inset-top,0px) + 150px);z-index:3000;background:rgba(0,0,0,.65);color:#fff;font:11px/1.35 ui-monospace,monospace;padding:4px 6px;border-radius:6px;pointer-events:none;white-space:pre";document.body.appendChild(d);
  let n=0,t=0,mx=0,ld=0;return(dt,now)=>{if(!dt)return;if(!ld)ld=(now/1000).toFixed(1);n++;t+=dt;mx=Math.max(mx,dt);if(t<1)return;const I=renderer.info.render;
  d.textContent=`${(n/t).toFixed(0)} fps · max ${(mx*1000|0)} ms\n${I.calls} draw · ${(I.triangles/1000|0)}k tri\n${renderer.domElement.width}×${renderer.domElement.height} pr ${renderer.getPixelRatio()} q${QF.l}\nnačítanie ${ld} s`;n=0;t=0;mx=0}})():null;
// nová verzia appky: service worker sa hneď aktualizuje a stránka sa raz obnoví
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("../sw.js",{scope:"../"}).then(r=>r.update()).catch(()=>{});
  let rl=false;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(rl)return;rl=true;location.reload()})}
