<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f3d2b">
<title>Fór 3D jamka</title>
<style>
:root{--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html,body{margin:0;height:100%;background:#9fc6e8;font-family:var(--font);overflow:hidden;overscroll-behavior:none}
canvas{display:block;touch-action:none}
#top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;background:linear-gradient(#0f3d2bee,#0f3d2b00);color:#fff;display:flex;align-items:center;gap:10px;pointer-events:none}
#top a{pointer-events:auto;color:#fff;text-decoration:none;font-size:1.4rem;background:rgba(255,255,255,.15);border-radius:10px;width:42px;height:42px;display:grid;place-items:center}
#holes{display:flex;gap:6px}#holes a{font-size:1rem;font-weight:700}#holes a.on{background:#fff;color:#0f3d2b}
#top b{font-size:1.3rem}#top small{display:block;opacity:.85}
#bar{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:8px}
#bar button{flex:1;font:600 .95rem var(--font);min-height:48px;border:0;border-radius:12px;background:#fff;color:#14211a;box-shadow:0 3px 12px rgba(0,0,0,.25)}
#bar button.on{background:#0f6b4a;color:#fff}
#tees{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 70px);display:flex;gap:6px;align-items:center;color:#fff;font-size:.85rem;text-shadow:0 1px 3px #000}
#tees a{color:#14211a;background:rgba(255,255,255,.85);border-radius:999px;padding:7px 12px;text-decoration:none;font-weight:600;text-shadow:none}#tees a.on{background:#0f6b4a;color:#fff}
#note{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 68px);color:#fff;font-size:.8rem;text-shadow:0 1px 3px #000;opacity:.9}
.lab{position:fixed;transform:translate(-50%,-100%);background:#fff;color:#14211a;font:700 13px var(--font);padding:3px 7px;border-radius:8px;white-space:nowrap;box-shadow:0 1px 5px rgba(0,0,0,.35);pointer-events:none}
.lab.arc{background:rgba(0,0,0,.55);color:#fff;font-weight:600}
</style>
<script type="importmap">{"imports":{"three":"./lib/three.module.min.js"}}</script>
</head>
<body>
<div id="top"><a href="../" aria-label="Späť do appky" style="font-size:1.4rem">‹</a><div style="flex:1"><b id="h-t">Akadémia</b><small id="h-s"></small></div><div id="holes"><a data-h="1" href="?h=1">1</a><a data-h="2" href="?h=2">2</a><a data-h="3" href="?h=3">3</a></div></div>
<div id="tees"><span>Odpalisko:</span><a data-t="0">zadné</a><a data-t="1">stredné</a><a data-t="2">predné</a></div>
<div id="note">Načítavam terén…</div>
<div id="bar"><button id="v-tee" class="on">Z odpaliska</button><button id="v-fly">Let ku greenu</button><button id="v-top">Zhora</button></div>
<script type="module">
import * as THREE from "three";
import {OrbitControls} from "./lib/OrbitControls.js";

// Akadémia Apex Golf, Báč. Terén z DMR 5.0 (ÚGKK SR, CC BY 4.0), greeny/bunkre/stromy obkreslené zo satelitu
// a zarovnané na terén. Dáta: akademia.json (ENU metre od greenu 1, x = východ, y = sever).
const DATA=await (await fetch("akademia.json")).json();
const Q=new URLSearchParams(location.search);
const hNum=Math.min(3,Math.max(1,parseInt(Q.get("h"))||1));
const tIdx=Math.min(2,Math.max(0,parseInt(Q.get("t"))||0));
const TEE_N=["zadné","stredné","predné"];
const STYLE={1:{dry:true},2:{},3:{dry:true,sunWest:true}}[hNum];

// --- terén
const TR=DATA.terrain,Hcm=new Int16Array(Uint8Array.from(atob(TR.cm),c=>c.charCodeAt(0)).buffer);
function hENU(e,n){let c=(e-TR.e0)/TR.step,r=(n-TR.n0)/TR.step;c=Math.min(TR.w-1.001,Math.max(0,c));r=Math.min(TR.h-1.001,Math.max(0,r));
  const c0=c|0,r0=r|0,fc=c-c0,fr=r-r0,i=r0*TR.w+c0;
  return TR.base+(Hcm[i]*(1-fc)*(1-fr)+Hcm[i+1]*fc*(1-fr)+Hcm[i+TR.w]*(1-fc)*fr+Hcm[i+TR.w+1]*fc*fr)/100}

// --- lokálny rámec jamky: odpalisko (0,0), y = smer na stred greenu, x = vpravo
const T=DATA.pads[hNum][tIdx],GC=DATA.gc[hNum-1];
const dx=GC[0]-T[0],dy=GC[1]-T[1],L=Math.hypot(dx,dy),u=[dx/L,dy/L],rt=[u[1],-u[0]];
const loc=([e,n])=>[(e-T[0])*rt[0]+(n-T[1])*rt[1],(e-T[0])*u[0]+(n-T[1])*u[1]];
const enu=(x,y)=>[T[0]+x*rt[0]+y*u[0],T[1]+x*rt[1]+y*u[1]];
const H0=hENU(T[0],T[1]);
const hL=(x,y)=>hENU(...enu(x,y))-H0;
const c=Math.round(L);
// predok a zadok greenu po línii hry
const green=DATA.greens[hNum-1].map(loc);
let ys=[];for(let i=0;i<green.length;i++){const[a,b]=green[i],[d,e]=green[(i+1)%green.length];if((a<=0)!==(d<=0)){ys.push(b+(e-b)*(0-a)/(d-a))}}
const f=Math.round(Math.min(...ys)),b=Math.round(Math.max(...ys));
const hG=hL(0,c);
const cen=P=>[P.reduce((a,p)=>a+p[0],0)/P.length,P.reduce((a,p)=>a+p[1],0)/P.length];
const nearestGreen=B=>{const q=cen(B);let bi=0,bd=1e9;DATA.gc.forEach((g,i)=>{const d=(g[0]-q[0])**2+(g[1]-q[1])**2;if(d<bd){bd=d;bi=i}});return bi};
document.getElementById("h-t").textContent="Jamka "+hNum+" · Par 3";
document.getElementById("h-s").textContent="Akadémia Apex · "+TEE_N[tIdx]+" odpalisko · "+f+" / "+c+" / "+b+" m";
document.querySelectorAll("#holes a").forEach(a=>{a.href="?h="+a.dataset.h+"&t="+tIdx;a.classList.toggle("on",+a.dataset.h===hNum)});
document.querySelectorAll("#tees a").forEach(a=>{a.href="?h="+hNum+"&t="+a.dataset.t;a.classList.toggle("on",+a.dataset.t===tIdx)});
const dh=hG;document.getElementById("note").textContent="Skutočný terén z výškového modelu DMR 5.0 (ÚGKK SR, CC BY 4.0). Green je "+(Math.abs(dh)<0.15?"v rovine s odpaliskom":(dh>0?"o "+dh.toFixed(1).replace(".",",")+" m vyššie":"o "+(-dh).toFixed(1).replace(".",",")+" m nižšie")+" ako odpalisko")+". Tvary zo satelitu.";

// --- scéna
const scene=new THREE.Scene();
const sky=STYLE.sunWest?0xc9dbe8:0x9fc6e8;
scene.background=new THREE.Color(sky);scene.fog=new THREE.Fog(sky,350,900);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,1,1500);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
const W=(x,y,h)=>new THREE.Vector3(x,h,-y);          // svet: X vpravo, Y hore, -Z dopredu
const hemi=new THREE.HemisphereLight(0xdff1ff,0x3a5a2a,STYLE.sunWest?1.9:1.15);scene.add(hemi);
const sun=new THREE.DirectionalLight(STYLE.sunWest?0xfff1d6:0xffffff,STYLE.sunWest?1.25:1.6);
// slnko: z juhu (poobede), pri jamke 3 večer zo západu
const sunDir=STYLE.sunWest?[-1,0.15]:[0.3,-1];const sl=loc([T[0]+sunDir[0]*200,T[1]+sunDir[1]*200]);
sun.position.copy(W(sl[0],sl[1],170));sun.target.position.copy(W(0,c*.5,0));sun.castShadow=true;
Object.assign(sun.shadow.camera,{left:-220,right:220,top:220,bottom:-220,near:1,far:800});sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-0.0003;sun.shadow.normalBias=0.5;
scene.add(sun,sun.target);

// --- terén + "namaľovaný" povrch (rough, fairway, greeny, bunkre, odpaliská)
const X0=-170,X1=170,Y0=-70,Y1=c+150,SEG=2;
const geo=new THREE.PlaneGeometry(X1-X0,Y1-Y0,(X1-X0)/SEG,(Y1-Y0)/SEG);geo.rotateX(-Math.PI/2);
geo.translate((X0+X1)/2,0,-(Y0+Y1)/2);
{const p=geo.attributes.position;for(let i=0;i<p.count;i++){p.setY(i,hL(p.getX(i),-p.getZ(i)))}geo.computeVertexNormals()}
const TEX=2048,cv=document.createElement("canvas");cv.width=cv.height=TEX;const g2=cv.getContext("2d");
const tx=x=>(x-X0)/(X1-X0)*TEX,ty=y=>(Y1-y)/(Y1-Y0)*TEX,ppm=TEX/(X1-X0);
function path(P){g2.beginPath();P.forEach(([x,y],i)=>i?g2.lineTo(tx(x),ty(y)):g2.moveTo(tx(x),ty(y)));g2.closePath()}
g2.fillStyle=STYLE.dry?"#b3ad66":"#86a352";g2.fillRect(0,0,TEX,TEX);
// textúra trávy: náhodné škvrny
let seed=7+hNum*13;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
for(let k=0;k<2500;k++){g2.fillStyle=STYLE.dry?(rnd()<.5?"rgba(150,150,80,.10)":"rgba(210,200,140,.10)"):(rnd()<.5?"rgba(90,130,50,.10)":"rgba(150,180,90,.10)");
  const r=(2+rnd()*6)*ppm/3;g2.beginPath();g2.arc(rnd()*TEX,rnd()*TEX,r,0,7);g2.fill()}
// pokosené plochy: podľa leteckých záberov (jamky 1 a 2), inak odhad
const MOW=DATA.mow&&DATA.mow[hNum];
if(MOW){for(const poly of MOW.slice().reverse()){const P=poly.map(loc);g2.save();path(P);g2.clip();g2.fillStyle="#74b04a";g2.fillRect(0,0,TEX,TEX);
  g2.fillStyle="rgba(40,90,25,.16)";for(let y=-20;y<c+30;y+=12){const a=ty(y),b2=ty(y+6);g2.fillRect(0,Math.min(a,b2),TEX,Math.abs(a-b2))}g2.restore()}}
else{const y0=22,y1=f-2,w=12;g2.save();g2.beginPath();g2.moveTo(tx(-w),ty(y0+8));g2.quadraticCurveTo(tx(-w),ty(y0),tx(0),ty(y0));g2.quadraticCurveTo(tx(w),ty(y0),tx(w),ty(y0+8));
 g2.lineTo(tx(w+2),ty(y1-6));g2.quadraticCurveTo(tx(w),ty(y1+2),tx(0),ty(y1+2));g2.quadraticCurveTo(tx(-w),ty(y1+2),tx(-w-2),ty(y1-6));g2.closePath();g2.clip();
 g2.fillStyle="#74b04a";g2.fillRect(0,0,TEX,TEX);g2.fillStyle="rgba(40,90,25,.18)";for(let y=y0;y<y1+4;y+=12){const a=ty(y),b2=ty(y+6);g2.fillRect(0,Math.min(a,b2),TEX,Math.abs(a-b2))}g2.restore()}
// greeny: lem (fringe) + plocha
for(const [i,G] of DATA.greens.entries()){if(i!==hNum-1)continue;const P=G.map(loc);path(P);g2.lineWidth=2.2*ppm;g2.strokeStyle="#5f9c3a";g2.stroke();g2.fillStyle=i===hNum-1?"#9fdc5a":"#93cf55";g2.fill()}
// bunkre
for(const B of DATA.bunkers){if(nearestGreen(B)!==hNum-1)continue;const P=B.map(loc);path(P);g2.fillStyle="#eadcae";g2.fill();g2.lineWidth=.6*ppm;g2.strokeStyle="#c8b88a";g2.stroke()}
// odpaliská
for(const k of [String(hNum)])DATA.pads[k].forEach((p,j)=>{const[x,y]=loc(p);g2.beginPath();g2.arc(tx(x),ty(y),4.5*ppm,0,7);
  g2.fillStyle=(+k===hNum&&j===tIdx)?"#a7e874":(+k===hNum?"#8fd062":"#86c45a");g2.fill();g2.lineWidth=.5*ppm;g2.strokeStyle="#5d9a3c";g2.stroke()});
// tieňovanie reliéfu (aby boli kopčeky vidno aj zhora)
{const ww=X1-X0,hh=Y1-Y0,sc2=document.createElement("canvas");sc2.width=ww;sc2.height=hh;const sx=sc2.getContext("2d"),im=sx.createImageData(ww,hh);
 const L0=[-0.5,0.55,0.67];const ex=1.6;
 for(let j=0;j<hh;j++){const y=Y1-j-.5;for(let i=0;i<ww;i++){const x=X0+i+.5;
   const gx=(hL(x+1,y)-hL(x-1,y))/2*ex,gy=(hL(x,y+1)-hL(x,y-1))/2*ex,n=Math.hypot(gx,gy,1);
   const v=Math.max(0,(-gx*L0[0]-gy*L0[1]+L0[2])/n)/L0[2];const k=(j*ww+i)*4;const val=Math.max(0,Math.min(255,128+(v-1)*300));
   im.data[k]=im.data[k+1]=im.data[k+2]=val;im.data[k+3]=255}}
 sx.putImageData(im,0,0);g2.save();g2.globalCompositeOperation="soft-light";g2.globalAlpha=.7;g2.drawImage(sc2,0,0,TEX,TEX);g2.restore()}
const tex=new THREE.CanvasTexture(cv);tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=renderer.capabilities.getMaxAnisotropy();
{const p=geo.attributes.position,uv=geo.attributes.uv;for(let i=0;i<p.count;i++){uv.setXY(i,(p.getX(i)-X0)/(X1-X0),(-p.getZ(i)-Y0)/(Y1-Y0))}}
const ground=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({map:tex,roughness:1}));ground.receiveShadow=true;scene.add(ground);
// okolie mimo modelu (rovina)
const far=new THREE.Mesh(new THREE.PlaneGeometry(3000,3000).rotateX(-Math.PI/2),new THREE.MeshStandardMaterial({color:STYLE.dry?0x9c9a52:0x6a8a3c,roughness:1}));
{let mn=1e9;const pp=geo.attributes.position;for(let i=0;i<pp.count;i++)mn=Math.min(mn,pp.getY(i));far.position.set(0,mn-2,-c/2)}scene.add(far);

// --- stromy
const trunkM=new THREE.MeshStandardMaterial({color:0x6b4a2b}),leafM=[0x2f6b2c,0x3b7d33,0x285e27].map(x=>new THREE.MeshStandardMaterial({color:x,roughness:.95}));
const inPoly=(pt,poly)=>{let s=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const[a,b]=poly[i],[d,e]=poly[j];if(((b>pt[1])!==(e>pt[1]))&&(pt[0]<(d-a)*(pt[1]-b)/(e-b)+a))s=!s}return s};
const inside=(x,y)=>x>X0+2&&x<X1-2&&y>Y0+2&&y<Y1-2;
const seeM=new THREE.MeshStandardMaterial({color:0x3b7d33,roughness:.95,transparent:true,opacity:.32,depthWrite:false});
// stromy, ktoré stoja v ploche hrania (medzi odpaliskom a greenom), sú priesvitné, aby bolo vidno cez ne
const inPlay=(x,y,r)=>y>-2&&y<c-5&&Math.abs(x)<r+9;
// pás stromov a kríkov (napr. vpravo od dvojky): husté koruny až po zem, bez kmeňov
function bush(x,y,r,h,k){if(!inside(x,y))return;const z=hL(x,y);
  const cr=new THREE.Mesh(new THREE.SphereGeometry(r,10,8),leafM[k%3]);cr.scale.set(1.15,(h*.5)/r,1.15);cr.position.copy(W(x,y,z+h*.45));cr.castShadow=true;scene.add(cr);
  const lo=new THREE.Mesh(new THREE.SphereGeometry(r*.9,8,6),leafM[(k+1)%3]);lo.scale.y=.7;lo.position.copy(W(x+(rnd()-.5)*r,y+(rnd()-.5)*r,z+r*.45));scene.add(lo)}
function tree(x,y,r,h,k){if(!inside(x,y))return;const z=hL(x,y);const see=inPlay(x,y,r);
  const tr=new THREE.Mesh(new THREE.CylinderGeometry(.35,.55,h*.5,6),trunkM);tr.position.copy(W(x,y,z+h*.25));tr.castShadow=true;scene.add(tr);
  const cr=new THREE.Mesh(new THREE.SphereGeometry(r,10,8),see?seeM:leafM[k%3]);cr.scale.y=1.2;cr.position.copy(W(x,y,z+h*.5+r*.8));cr.castShadow=!see;scene.add(cr)}
DATA.trees.forEach(([e,n,r,h],k)=>{const[x,y]=loc([e,n]);tree(x,y,r,h,k)});
{const thin=new THREE.MeshStandardMaterial({color:0x6f9f45,roughness:.9});
 DATA.row.forEach(p=>{const[x,y]=loc(p);if(!inside(x,y))return;const z=hL(x,y),h=6+rnd()*2;
  const tr=new THREE.Mesh(new THREE.CylinderGeometry(.12,.2,h*.5,6),trunkM);tr.position.copy(W(x,y,z+h*.25));scene.add(tr);
  const cr=new THREE.Mesh(new THREE.SphereGeometry(1.9,8,6),thin);cr.scale.y=1.5;cr.position.copy(W(x,y,z+h*.62));cr.castShadow=true;scene.add(cr)})}
for(const wd of DATA.woods){const xs=wd.map(p=>p[0]),yy=wd.map(p=>p[1]);let n=0;
  for(let k=0;k<3000&&n<90;k++){const e=Math.min(...xs)+rnd()*(Math.max(...xs)-Math.min(...xs)),nn=Math.min(...yy)+rnd()*(Math.max(...yy)-Math.min(...yy));
    if(!inPoly([e,nn],wd))continue;n++;const[x,y]=loc([e,nn]);bush(x,y,3+rnd()*2.5,10+rnd()*7,k)}}

// --- vlajka, značky odpaliska
const pin=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,2.4,8),new THREE.MeshStandardMaterial({color:0xffffff}));pin.position.copy(W(0,c,hG+1.2));pin.castShadow=true;scene.add(pin);
const flag=new THREE.Mesh(new THREE.PlaneGeometry(.8,.5),new THREE.MeshStandardMaterial({color:0xe0312b,side:THREE.DoubleSide}));flag.position.copy(W(.4,c,hG+2.15));scene.add(flag);
const mkC=[0xffffff,0xffd400,0xe0312b][tIdx];
for(const sx of [-2.2,2.2]){const mk=new THREE.Mesh(new THREE.SphereGeometry(.16,10,10),new THREE.MeshStandardMaterial({color:mkC}));mk.position.copy(W(sx,1.5,hL(sx,1.5)+.16));scene.add(mk)}
// --- oblúky a línia hry (prilepené na terén)
const arcs=[];
for(const d of [50,100]){if(d>=c-10)continue;const pts=[];for(let a=-0.45;a<=0.451;a+=0.03){const x=Math.sin(a)*d,y=c-Math.cos(a)*d;pts.push(W(x,y,hL(x,y)+.35))}
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.8})));
  arcs.push({d,pos:W(Math.sin(.45)*d,c-Math.cos(.45)*d,hL(Math.sin(.45)*d,c-Math.cos(.45)*d)+1.2)})}
{const pts=[];for(let y=0;y<=c;y+=2)pts.push(W(0,y,hL(0,y)+.3));
 scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineDashedMaterial({color:0xd23b2a,dashSize:3,gapSize:2})).computeLineDistances())}

// --- štítky
const labels=[];
function label(text,v,cls=""){const el=document.createElement("div");el.className="lab "+cls;el.textContent=text;document.body.appendChild(el);labels.push({el,v})}
label("Green · "+c+" m",W(0,c,hG+4));
for(const a of arcs)label(a.d+" m",a.pos,"arc");
function placeLabels(){for(const l of labels){const p=l.v.clone().project(camera);const vis=p.z<1&&Math.abs(p.x)<1.1&&Math.abs(p.y)<1.1;
  l.el.style.display=vis?"block":"none";if(vis){l.el.style.left=((p.x+1)/2*innerWidth)+"px";l.el.style.top=((1-p.y)/2*innerHeight)+"px"}}}

// --- kamera
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.maxPolarAngle=Math.PI*0.48;controls.minDistance=8;controls.maxDistance=500;
const eye=1.7;
const views={tee:{pos:W(0,-5,hL(0,-5)+eye+1.3),target:W(0,c*.9,hL(0,c*.9))},top:{pos:W(0,c*.5-25,230),target:W(0,c*.5,0)}};
function go(v){camera.position.copy(v.pos);controls.target.copy(v.target);controls.update()}
go(views.tee);
let fly=null;
const btns={tee:document.getElementById("v-tee"),fly:document.getElementById("v-fly"),top:document.getElementById("v-top")};
function setOn(k){for(const x in btns)btns[x].classList.toggle("on",x===k)}
btns.tee.onclick=()=>{fly=null;go(views.tee);setOn("tee")};
btns.top.onclick=()=>{fly=null;go(views.top);setOn("top")};
btns.fly.onclick=()=>{fly={t0:performance.now()};setOn("fly")};
const curve=new THREE.CatmullRomCurve3([views.tee.pos.clone(),W(0,c*.3,hL(0,c*.3)+22),W(0,c*.65,hL(0,c*.65)+16),W(0,c-38,hG+9)]);
renderer.domElement.addEventListener("pointerdown",()=>{if(fly){fly=null;setOn("")}});
function loop(now){
  if(fly){const k=Math.min(1,(now-fly.t0)/9000),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    camera.position.copy(curve.getPoint(e));controls.target.copy(W(0,c,hG));if(k>=1)fly=null}
  controls.update();renderer.render(scene,camera);placeLabels();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
