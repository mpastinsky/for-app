<title>Fór 3D jamka</title>
<style>
:root{--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html,body{margin:0;height:100%;background:#9fc6e8;font-family:var(--font);overflow:hidden;overscroll-behavior:none}
canvas{display:block;touch-action:none}
#top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;background:linear-gradient(#0f3d2bee,#0f3d2b00);color:#fff;display:flex;align-items:center;gap:10px;pointer-events:none}
#top a{pointer-events:auto;color:#fff;text-decoration:none;font-size:1.4rem;background:rgba(255,255,255,.15);border-radius:10px;width:42px;height:42px;display:grid;place-items:center}
#holes{display:flex;gap:6px}#holes a{font-size:1rem;font-weight:700}#holes a.on{background:#fff;color:#0f3d2b}
#top b{font-size:1.3rem}#top small{display:block;opacity:.85}
#bar{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:8px}
#bar button{flex:1;font:600 .95rem var(--font);min-height:48px;border:0;border-radius:12px;background:#fff;color:#14211a;box-shadow:0 3px 12px rgba(0,0,0,.25)}
#bar button.on{background:#0f6b4a;color:#fff}
#tees{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 70px);display:flex;gap:6px;align-items:center;color:#fff;font-size:.85rem;text-shadow:0 1px 3px #000}
#tees a{color:#14211a;background:rgba(255,255,255,.85);border-radius:999px;padding:7px 12px;text-decoration:none;font-weight:600;text-shadow:none}#tees a.on{background:#0f6b4a;color:#fff}
#note{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 68px);color:#fff;font-size:.8rem;text-shadow:0 1px 3px #000;opacity:.9}
.lab{position:fixed;transform:translate(-50%,-100%);background:#fff;color:#14211a;font:700 13px var(--font);padding:3px 7px;border-radius:8px;white-space:nowrap;box-shadow:0 1px 5px rgba(0,0,0,.35);pointer-events:none}
.lab.arc{background:rgba(0,0,0,.55);color:#fff;font-weight:600}
</style>

   fairway:[[-11,35],[-13,60],[-12,85],[-9,105],[-6,116],[6,117],[11,104],[14,80],[13,55],[10,35]],
   bunkers:[[[-17,130],[-14,128],[-13,134],[-15,138],[-13,143],[-15,149],[-18,147],[-17,141],[-19,136]],"c:15,123,4"],
   // podľa videa z odpaliska (16.11.): suchý žltkastý rough, okrúhle vyvýšené predné odpalisko kúsok vpredu,

   video:{note:"Greeny, bunkre a stromy podľa satelitu, usadené na GPS z hodiniek. Valy a farby podľa tvojho videa.",

 2:{par:3,c:100,f:90,b:109,dir:"na sever",
   green:[[-3,90.5],[5,92],[8,98],[7,105],[1,109],[-6,107],[-8,101],[-12,95],[-13,88],[-7,86]],
   fairway:[[-9,25],[-10,50],[-10,72],[-9,82],[4,84],[8,74],[10,50],[9,25]],
   bunkers:[[[12,99],[15,102],[18,98],[16,93],[17,88],[14,85],[11,89],[13,94]]],
   // podľa videa z odpaliska (16.11.): hustý pás listnatých stromov za greenom, trávnaté vlny vľavo aj vpravo od greenu
   video:{treeline:[-120,120,D2(150),D2(175)],mounds:[[-26,96,12,20,1.6],[25,104,10,16,1.4],[-5,128,32,7,1.3]],openSides:true,note:"Greeny, bunkre a stromy podľa satelitu, usadené na GPS z hodiniek. Valy podľa tvojho videa."}},
 3:{par:3,c:136,f:122,b:146,dir:"na západ",
   green:[[-4,123],[4,122],[9,127],[8,134],[10,140],[6,146],[-2,146],[-7,141],[-6,133],[-8,127]],
   fairway:[[-7,30],[-8,60],[-6,90],[-5,112],[3,118],[7,95],[8,65],[7,30]],
   bunkers:["c:-18,140,3.5","c:-15,80,3.5"],
   // podľa videa (16.11.): veľký listnatý strom vľavo pri odpalisku, dva mladé riedke stromy vpravo pred greenom,
   // trávnaté valy s kvetmi za greenom a vľavo, hrá sa proti zapadajúcemu slnku, okolie otvorené
   video:{note:"Greeny, bunkre a stromy podľa satelitu, usadené na GPS z hodiniek. Valy a večerné slnko podľa tvojho videa.",big:[[-16,-2,6,15]],young:[[13,108],[19,117],[24,126]],mounds:[[0,162,38,8,2.2],[-30,150,10,18,1.8],[28,158,14,7,1.5]],sunWest:true,openSides:true}}
};
const hNum=Math.min(3,Math.max(1,parseInt(new URLSearchParams(location.search).get("h"))||1));
const D=HOLES[hNum];
const circ=s=>{const[x,y,r]=s.slice(2).split(",").map(Number);return Array.from({length:14},(_,i)=>[x+Math.cos(i/14*6.283)*r,y+Math.sin(i/14*6.283)*r])};
const TEE_N=["zadné","stredné","predné"];
const tIdx=Math.min(2,Math.max(0,parseInt(new URLSearchParams(location.search).get("t"))||0));
const SD=SAT[hNum][tIdx];D.c=SD.c;D.f=SD.f;D.b=SD.b;if(D.video)D.video.mounds=SD.mounds;
const H={fairway:SD.fairway,green:SD.green,bunkers:SD.bunkers};
const P=p=>p;
const G=[0,D.c];
document.getElementById("h-t").textContent="Jamka "+hNum+" · Par "+D.par;
document.getElementById("h-s").textContent="Akadémia Apex · "+TEE_N[tIdx]+" odpalisko · "+D.f+" / "+D.c+" / "+D.b+" m";
document.querySelectorAll("#holes a").forEach(a=>a.href="?h="+a.dataset.h+"&t="+tIdx);
document.querySelectorAll("#tees a").forEach(a=>{a.href="?h="+hNum+"&t="+a.dataset.t;a.classList.toggle("on",+a.dataset.t===tIdx)});
document.querySelectorAll("#holes a").forEach(a=>a.classList.toggle("on",+a.dataset.h===hNum));

// --- scéna
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9fc6e8);scene.fog=new THREE.Fog(0x9fc6e8,500,1200);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.5,2000);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);
const hemi=new THREE.HemisphereLight(0xdff1ff,0x3a5a2a,1.1);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,1.6);sun.position.set(-120,220,80);sun.castShadow=true;
Object.assign(sun.shadow.camera,{left:-260,right:260,top:260,bottom:-260,far:700});sun.shadow.mapSize.set(2048,2048);scene.add(sun);
sun.target.position.set(0,0,-150);scene.add(sun.target);

// Svet: X = vpravo, Z = -dopredu, Y = výška
const W=([x,y])=>new THREE.Vector2(x,y);
const toWorld=(x,y,h=0)=>new THREE.Vector3(x,h,-y);
function shapeMesh(px,color,h,{rough=0.9,lift=0}={}){
  const shape=new THREE.Shape(px.map(P).map(W));
  const geo=new THREE.ExtrudeGeometry(shape,{depth:Math.max(h,0.05),bevelEnabled:true,bevelThickness:Math.min(0.6,Math.max(h,0.05)),bevelSize:1.2,bevelSegments:3,curveSegments:8});
  geo.rotateX(-Math.PI/2);
  const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color,roughness:rough}));
  m.position.y=lift;m.receiveShadow=true;scene.add(m);return m;
}
// rough (terén s jemným vlnením)
const ground=new THREE.PlaneGeometry(900,900,90,90);ground.rotateX(-Math.PI/2);
const pos=ground.attributes.position;for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getZ(i);pos.setY(i,Math.sin(x*.03)*.15+Math.cos(z*.025)*.15-0.4)}
ground.computeVertexNormals();
const gm=new THREE.Mesh(ground,new THREE.MeshStandardMaterial({color:0x4e7a33,roughness:1}));gm.position.z=-160;gm.receiveShadow=true;scene.add(gm);

// fairway pruhy
const fw=shapeMesh(H.fairway,0x79b84f,0.15,{lift:0.35});
const stripes=new THREE.CanvasTexture((()=>{const c=document.createElement("canvas");c.width=64;c.height=64;const x=c.getContext("2d");
  x.fillStyle="#5fa63c";x.fillRect(0,0,64,64);x.fillStyle="#529833";x.fillRect(0,0,64,32);return c})());
stripes.colorSpace=THREE.SRGBColorSpace;stripes.wrapS=stripes.wrapT=THREE.RepeatWrapping;stripes.repeat.set(1,1);
fw.material=new THREE.MeshStandardMaterial({map:stripes,roughness:.9});
// UV pre pruhy: podľa svetovej Z
{const g=fw.geometry,p=g.attributes.position,uv=new Float32Array(p.count*2);for(let i=0;i<p.count;i++){uv[i*2]=p.getX(i)/24;uv[i*2+1]=p.getZ(i)/24}g.setAttribute("uv",new THREE.BufferAttribute(uv,2))}
// green (mierne vyvýšený)
shapeMesh(H.green,0xa6dc5c,0.5,{lift:0.4,rough:.7});
// predgreen / odpalisko
for(const [x,y,k] of SD.pads){const m=new THREE.Mesh(new THREE.CylinderGeometry(4.2,5.2,k?0.6:0.4,32),new THREE.MeshStandardMaterial({color:k===1?0x9be06a:0x86c45a,roughness:.9}));m.position.copy(toWorld(x,y,0.1));m.receiveShadow=true;scene.add(m)}
for(const sx of [-2.5,2.5]){const mk=new THREE.Mesh(new THREE.SphereGeometry(.18,10,10),new THREE.MeshStandardMaterial({color:0xffd400}));mk.position.copy(toWorld(sx,3,0.75));scene.add(mk)}
// bunkre (znížené, piesok)
for(const b of H.bunkers){const m=shapeMesh(b,0xeadcae,0.05,{lift:0.12,rough:1});}
// stromy v plochách
const trunkM=new THREE.MeshStandardMaterial({color:0x6b4a2b}),leafM=[0x2f6b2c,0x3b7d33,0x285e27].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:.95}));
function inPoly(pt,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const[a,b]=poly[i],[d,e]=poly[j];if(((b>pt[1])!==(e>pt[1]))&&(pt[0]<(d-a)*(pt[1]-b)/(e-b)+a))c=!c}return c}
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const V=D.video||null;
if(V){
  for(const [x,y,r,h] of []){const tr=new THREE.Mesh(new THREE.CylinderGeometry(.6,.9,h*.5,8),trunkM);tr.position.copy(toWorld(x,y,h*.25));tr.castShadow=true;scene.add(tr);
    for(let k=0;k<6;k++){const cr=new THREE.Mesh(new THREE.SphereGeometry(r*(.55+rnd()*.25),12,10),leafM[1]);cr.position.copy(toWorld(x+(rnd()-.5)*r*1.2,y+(rnd()-.5)*r*1.2,h*.55+rnd()*r*.6));cr.castShadow=true;scene.add(cr)}}
  const thinM=new THREE.MeshStandardMaterial({color:0x8fbf5a,roughness:.9,transparent:true,opacity:.75});
  for(const [x,y] of []){const h=7+rnd()*2;const tr=new THREE.Mesh(new THREE.CylinderGeometry(.12,.2,h,6),trunkM);tr.position.copy(toWorld(x,y,h/2));scene.add(tr);
    const cr=new THREE.Mesh(new THREE.ConeGeometry(1.8,h*.7,8),thinM);cr.position.copy(toWorld(x,y,h*.62));cr.castShadow=true;scene.add(cr)}
  const moundM=new THREE.MeshStandardMaterial({color:0x7da24a,roughness:1});
  for(const [x,y,rx,ry,h] of V.mounds||[]){const m=new THREE.Mesh(new THREE.SphereGeometry(1,24,12,0,Math.PI*2,0,Math.PI/2),moundM);m.scale.set(rx,h,ry);m.position.copy(toWorld(x,y,-0.2));m.receiveShadow=true;scene.add(m);
    for(let k=0;k<rx*ry/4;k++){const a=rnd()*6.283,rr=Math.sqrt(rnd());const dx=Math.cos(a)*rr*rx*.9,dy=Math.sin(a)*rr*ry*.9;const hh=h*Math.sqrt(Math.max(0,1-rr*rr))-0.1;
      const f=new THREE.Mesh(new THREE.SphereGeometry(.12,4,3),new THREE.MeshBasicMaterial({color:0xffffff}));f.position.copy(toWorld(x+dx,y+dy,hh));scene.add(f)}}
  if(V.sunWest){sun.position.copy(toWorld(-10,D.c+260,60));sun.target.position.copy(toWorld(0,D.c*.5,0));sun.color.set(0xfff1d6);sun.intensity=1.2;hemi.intensity=2.1;scene.background.set(0xc9dbe8);scene.fog.color.set(0xc9dbe8)}
  if(V.dry)gm.material.color.set(0x9c9a52);
  for(const [x,y,r] of []){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r+1.2,0.6,32),new THREE.MeshStandardMaterial({color:0x8fcf62,roughness:.9}));m.position.copy(toWorld(x,y,0.1));m.receiveShadow=true;scene.add(m)}
  if(false){const[x0,x1,y0,y1]=V.treeline;for(let k=0;k<160;k++){const pt=[x0+rnd()*(x1-x0),y0+rnd()*(y1-y0)];const h=12+rnd()*8,r=3.5+rnd()*2.5;
    const cr=new THREE.Mesh(new THREE.SphereGeometry(r,10,8),leafM[k%3]);cr.scale.y=1.3;cr.position.copy(toWorld(pt[0],pt[1],h*.5+r));cr.castShadow=true;scene.add(cr);
    const tr=new THREE.Mesh(new THREE.CylinderGeometry(.35,.5,h*.5,6),trunkM);tr.position.copy(toWorld(pt[0],pt[1],h*.25));scene.add(tr)}}
  document.getElementById("note").textContent=V.note;
}

// --- skutočné prvky zo satelitu
shapeMeshAll();
function shapeMeshAll(){
  for(const g of SD.others)shapeMesh(g,0xa6dc5c,0.5,{lift:0.4,rough:.7});
  for(const [x,y] of []){const t=new THREE.Mesh(new THREE.BoxGeometry(9,0.5,9),new THREE.MeshStandardMaterial({color:0x8ccd5f}));t.position.copy(toWorld(x,y,0.25));t.receiveShadow=true;scene.add(t)}
}
function bigTree(x,y,r,h,k){const tr=new THREE.Mesh(new THREE.CylinderGeometry(.35,.55,h*.5,6),trunkM);tr.position.copy(toWorld(x,y,h*.25));tr.castShadow=true;scene.add(tr);
  const cr=new THREE.Mesh(new THREE.SphereGeometry(r,10,8),leafM[k%3]);cr.scale.y=1.2;cr.position.copy(toWorld(x,y,h*.5+r*.8));cr.castShadow=true;scene.add(cr)}
SD.trees.forEach(([x,y,r,h],k)=>bigTree(x,y,r,h,k));
{const thin=new THREE.MeshStandardMaterial({color:0x6f9f45,roughness:.9});
 SD.row.forEach(([x,y])=>{const h=6+rnd()*2;const tr=new THREE.Mesh(new THREE.CylinderGeometry(.12,.2,h*.5,6),trunkM);tr.position.copy(toWorld(x,y,h*.25));scene.add(tr);
  const cr=new THREE.Mesh(new THREE.SphereGeometry(1.9,8,6),thin);cr.scale.y=1.5;cr.position.copy(toWorld(x,y,h*.62));cr.castShadow=true;scene.add(cr)})}
for(const wd of SD.woods){let xs=wd.map(p=>p[0]),ys=wd.map(p=>p[1]);const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  let n=0;for(let k=0;k<2000&&n<90;k++){const pt=[x0+rnd()*(x1-x0),y0+rnd()*(y1-y0)];if(!inPoly(pt,wd))continue;n++;bigTree(pt[0],pt[1],3+rnd()*2.5,11+rnd()*8,k)}}
// vlajka
const pin=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,6,8),new THREE.MeshStandardMaterial({color:0xffffff}));pin.position.copy(toWorld(G[0],G[1],3.9));pin.castShadow=true;scene.add(pin);
const flag=new THREE.Mesh(new THREE.PlaneGeometry(1.8,1.1),new THREE.MeshStandardMaterial({color:0xe0312b,side:THREE.DoubleSide}));flag.position.copy(toWorld(G[0]+0.9,G[1],6.3));scene.add(flag);
// oblúky 50/100/150 m od greenu
const arcs=[];
for(const d of [50,100]){const pts=[];const dir=Math.atan2(-G[1],-G[0]);
  for(let a=-0.5;a<=0.5;a+=0.05){pts.push(toWorld(G[0]+Math.cos(dir+a)*d,G[1]+Math.sin(dir+a)*d,0.8))}
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.75})));
  arcs.push({d,pos:toWorld(G[0]+Math.cos(dir+.5)*d,G[1]+Math.sin(dir+.5)*d,1.5)})}
// línia hry
const line=[toWorld(0,0,1),toWorld(G[0],G[1],1)];
scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(line),new THREE.LineDashedMaterial({color:0xd23b2a,dashSize:4,gapSize:3})).computeLineDistances());

// štítky
const labels=[];
function label(text,v,cls=""){const el=document.createElement("div");el.className="lab "+cls;el.textContent=text;document.body.appendChild(el);labels.push({el,v});}
label("Green · "+D.c+" m",toWorld(G[0],G[1],8));
for(const a of arcs)label(a.d+" m",a.pos,"arc");
function placeLabels(){for(const l of labels){const p=l.v.clone().project(camera);
  const vis=p.z<1&&Math.abs(p.x)<1.1&&Math.abs(p.y)<1.1;l.el.style.display=vis?"block":"none";
  if(vis){l.el.style.left=((p.x+1)/2*innerWidth)+"px";l.el.style.top=((1-p.y)/2*innerHeight)+"px"}}}

// kamera
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.maxPolarAngle=Math.PI*0.47;controls.minDistance=20;controls.maxDistance=600;
const views={
  tee:{pos:toWorld(0,-6,4.5),target:toWorld(0,D.c*.85,0)},
  top:{pos:toWorld(0,D.c*.5-30,260),target:toWorld(0,D.c*.5,0)}
};
function go(v){camera.position.copy(v.pos);controls.target.copy(v.target);controls.update()}
go(views.tee);
let fly=null;
const btns={tee:document.getElementById("v-tee"),fly:document.getElementById("v-fly"),top:document.getElementById("v-top")};
function setOn(k){for(const b in btns)btns[b].classList.toggle("on",b===k)}
btns.tee.onclick=()=>{fly=null;go(views.tee);setOn("tee")};
btns.top.onclick=()=>{fly=null;go(views.top);setOn("top")};
btns.fly.onclick=()=>{fly={t0:performance.now()};setOn("fly")};
const curve=new THREE.CatmullRomCurve3([toWorld(0,-6,4.5),toWorld(0,D.c*.35,32),toWorld(0,D.c*.7,24),toWorld(0,D.c-32,10)]);
renderer.domElement.addEventListener("pointerdown",()=>{if(fly){fly=null;setOn("")}});

function loop(now){
  if(fly){const k=Math.min(1,(now-fly.t0)/9000),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    camera.position.copy(curve.getPoint(e));controls.target.copy(toWorld(G[0],G[1],0));if(k>=1)fly=null}
  controls.update();renderer.render(scene,camera);placeLabels();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
